        checked: 2026-11
        source: https://github.com/turbineBMW/omarchy-hardware-reports/issues/2
      suspend:
        state: partial
        note: Suspend turns the keyboard light off, but the fan keeps running, and only the power button wakes the laptop, not the keyboard or touchpad.
        version: linux-omarchy 7.3-71
        checked: 2026-11
        source: https://github.com/turbineBMW/omarchy-hardware-reports/issues/2
      lid:
        state: works
        note: Closing the lid blanked the screen in the owner's first boot with this device tree, and the author of the posted device tree lists the lid switch as working.
        checked: 2026-11
        source: https://github.com/turbineBMW/omarchy-hardware-reports/issues/2
      usb:
        state: works
        note: The owner found the USB ports working, and the author of the posted device tree lists USB-A and USB-C as working. Full speed on the USB-C ports is not reported.
        checked: 2026-11
        source: https://github.com/turbineBMW/omarchy-hardware-reports/issues/2
      external-display:
        state: works
        note: The HDMI port gave a picture in the owner's first boot with this device tree, and the author of the posted device tree lists HDMI as working. A screen on USB-C is not reported.
        checked: 2026-11
        source: https://github.com/turbineBMW/omarchy-hardware-reports/issues/2
      video-decode:
        state: broken
        note: The owner's Omarchy log shows hardware video decoding not starting, so videos play on the processor. The author of the posted device tree left the video engine off because it rejects the Windows firmware.
        version: linux-omarchy 7.3
        checked: 2026-11
        source: https://github.com/turbineBMW/omarchy-hardware-reports/issues/2
      fans:
        state: partial
        note: Temperatures read normally, around 30 °C when idle, but the fan is run by the laptop's own controller and keeps spinning where Windows keeps it quiet. Another owner saw the laptop reach its thermal limit under long load on mainline.
        version: linux-omarchy 7.3-71
        checked: 2026-11
        source: https://github.com/turbineBMW/omarchy-hardware-reports/issues/2

