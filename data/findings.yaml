  asus-zenbook-a14-ux3407:
    details: The A14 comes as the UX3407QA (Snapdragon X or X Plus, OLED or LCD panel) and the UX3407RA (Snapdragon X Elite, with a different Wi-Fi card). The LCD panel has its own device tree because its brightness is driven differently. Mainline Linux has the trees since 6.17, and owners run it on Ubuntu, Arch Linux ARM and Omarchy. On Omarchy 4.5 release candidates the first boot is dark at the disk password prompt, and the desktop needs ASUS's GPU firmware, which the edge channel packages.
    links:
      - title: Owner's report for the UX3407QA with the LCD panel on Omarchy
        url: https://github.com/omacom/omarchy/discussions/12761
      - title: Omarchy on Snapdragon X laptops, with A14 owners' install reports
        url: https://github.com/omacom/omarchy/discussions/11823
      - title: Ubuntu's support thread for the Zenbook A14
        url: https://bugs.launchpad.net/ubuntu-concept/+bug/2106218
      - title: Owner's hardware report on Kubuntu 26.04
        url: https://github.com/turbineBMW/omarchy-hardware-reports/issues/11
    checks:
      installer:
        state: works
        note: Owners of the UX3407QA installed Omarchy 4.5 release candidates from the USB stick without trouble. The problems came at the first boot after the install.
        version: Omarchy 4.5 rc1 to rc3
        checked: 2026-11
        source: https://github.com/omacom/omarchy/discussions/11823
      disk-unlock:
        state: partial
        note: On an encrypted install the prompt stays dark, and typing the password blind unlocks the disk. A fix that loads the display drivers early was merged in November 2026 and no owner has confirmed it yet.
        version: Omarchy 4.5 rc3
        checked: 2026-11
        source: https://github.com/omacom/omarchy/pull/19014
      display:
        state: works
        note: The LCD panel shows the desktop at 1920x1200 on Omarchy's kernel, and the device tree's author lists the OLED panel as working.
        version: linux-omarchy 7.2.8-11
        checked: 2026-10
        source: https://github.com/omacom/omarchy/discussions/12761
      gpu:
        state: partial
        note: With ASUS's GPU firmware the desktop runs on the GPU. Omarchy 4.5 release candidates did not carry that firmware, so the desktop failed to start until an owner copied it from Windows, and the edge image now has it as a package.
        version: Omarchy 4.5 rc1 to rc3
        checked: 2026-11
        source: https://github.com/omacom/omarchy/discussions/11823
      backlight:
        state: works
        note: Brightness control works on the LCD panel on Omarchy's kernel, and the device tree's author lists it as working on the OLED panel. The brightness keys themselves are not mentioned.
        version: linux-omarchy 7.2.8-11
        checked: 2026-10
        source: https://github.com/omacom/omarchy/discussions/12761
      keyboard:
        state: partial
        note: The keys type, but on Kubuntu 26.04 an owner reports the keyboard backlight does not work well.
        version: Kubuntu 26.04, kernel 7.0.0-32-qcom-x1e
        checked: 2026-11
        source: https://github.com/turbineBMW/omarchy-hardware-reports/issues/11
      touchpad:
        state: works
        note: The touchpad works on the installed Omarchy system.
        version: linux-omarchy 7.2.8-11
        checked: 2026-10
        source: https://github.com/omacom/omarchy/discussions/12761
      wifi:
        state: partial
        note: On Omarchy's kernel in October 2026 the Wi-Fi card of the UX3407QA only appeared after its calibration data and firmware were copied from the Windows driver package. With them it connects and comes back after reboots.
        version: linux-omarchy 7.2.8-11
        checked: 2026-10
        source: https://github.com/omacom/omarchy/discussions/12761
      bluetooth:
        state: works
        note: The device tree's author lists Bluetooth as working on the UX3407QA. On Omarchy the controller comes up and pairing has not been tried.
        version: "6.17"
        checked: 2025-06
        source: https://github.com/torvalds/linux/commit/6516961352a1
      speakers:
        state: partial
        note: On Omarchy's kernel in October 2026 the built-in speakers gave no sound on the UX3407QA. The device tree's author has both speakers working on mainline.
        version: linux-omarchy 7.2.8-11
        checked: 2026-10
        source: https://github.com/omacom/omarchy/discussions/12761
      microphones:
        state: partial
        note: On Omarchy's kernel in October 2026 the built-in microphones did not work on the UX3407QA. The device tree's author has both microphones working on mainline.
        version: linux-omarchy 7.2.8-11
        checked: 2026-10
        source: https://github.com/omacom/omarchy/discussions/12761
      headphones:
        state: works
        note: The device tree's author lists the headphone jack as working, both channels and the headset microphone.
        version: "6.17"
        checked: 2025-06
        source: https://github.com/torvalds/linux/commit/38d0b804b9d7
      adsp:
        state: works
        note: The device tree's author lists the audio DSP's firmware loading and battery information as working on the UX3407QA.
        version: "6.17"
        checked: 2025-06
        source: https://github.com/torvalds/linux/commit/6516961352a1
      battery:
        state: works
        note: The device tree's author lists battery information as working. On Ubuntu, owners saw no battery status until ASUS's firmware was installed.
        version: "6.17"
        checked: 2025-06
        source: https://github.com/torvalds/linux/commit/6516961352a1
      suspend:
        state: works
        note: Suspend and resume work on the installed Omarchy system on the UX3407QA with the LCD panel.
        version: linux-omarchy 7.2.8-11
        checked: 2026-10
        source: https://github.com/omacom/omarchy/discussions/12761
      suspend-drain:
        state: broken
        note: On Kubuntu 26.04 an owner reports that sleep uses too much power to last a night.
        version: Kubuntu 26.04, kernel 7.0.0-32-qcom-x1e
        checked: 2026-11
        source: https://github.com/turbineBMW/omarchy-hardware-reports/issues/11
      hibernate:
        state: broken
        note: On Ubuntu an owner got everything on the A14 working except hibernation.
        checked: 2026-03
        source: https://discourse.ubuntu.com/t/faq-ubuntu-25-04-25-10-on-snapdragon-x-elite/61016/249
      lid:
        state: works
        note: The device tree's author lists the lid switch as working.
        version: "6.17"
        checked: 2025-06
        source: https://github.com/torvalds/linux/commit/6516961352a1
      usb:
        state: works
        note: The device tree's author lists the USB-A port and both USB-C ports as working at USB 2 and USB 3 speeds, in both plug orientations.
        version: "6.17"
        checked: 2025-06
        source: https://github.com/torvalds/linux/commit/6516961352a1
      external-display:
        state: works
        note: The device tree's author lists DisplayPort over both USB-C ports as working in both plug orientations. The HDMI port was left out at first and added to the tree in Linux 7.1.
        version: "6.17"
        checked: 2025-06
        source: https://github.com/torvalds/linux/commit/6516961352a1
      camera:
        state: partial
        note: The camera did not work on Omarchy's kernel in October 2026. On Ubuntu's kernel 7.0 an owner got a picture, but starting the camera app a second time failed with a clock error.
        version: linux-omarchy 7.2.8-11
        checked: 2026-10
        source: https://github.com/omacom/omarchy/discussions/12761
      fans:
        state: partial
        note: On Ubuntu 25.10 an owner of the UX3407RA found the fan speeds up under load and then never slows down again until a reboot.
