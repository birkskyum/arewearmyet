  samsung-galaxy-book-go:
    details: It has no device tree in the Linux kernel. What is known comes from owners running the community velvet-os Debian images with a draft tree, a setup its maintainer says never reached a properly supported state. Starting from USB is unreliable. Owners report that the firmware often ignores a USB stick, and that plugging it in through a USB hub or starting GRUB from the internal disk makes it dependable. The firmware does not start from the SD card. Omarchy's tree is a reworked version of that draft. It moves the keyboard to the interrupt pin the laptop's own tables give and adds backlight, battery gauge, lid and sound from an owner's tests, and it has not been run on Omarchy yet.
    links:
      - title: "velvet-os: Snapdragon 7c Windows laptops status"
        url: https://github.com/velvet-os/imagebuilder/issues/136
      - title: "aarch64-laptops: Samsung Galaxy Book Go bring-up thread"
        url: https://github.com/aarch64-laptops/debian-cdimage/issues/21
    checks:
      display:
        state: works
        note: The built-in screen works on the velvet-os Debian images.
        checked: 2025-05
        source: https://github.com/velvet-os/imagebuilder/issues/136
      gpu:
        state: works
        note: Graphics acceleration works on the velvet-os images once the firmware files from Windows are installed. The screen shows random noise until the desktop starts.
        checked: 2025-05
        source: https://github.com/velvet-os/imagebuilder/issues/136
      backlight:
        state: broken
        note: On the velvet-os images the brightness cannot be changed and the screen stays dim. One owner got a bright screen only by building a kernel without any backlight driver.
        checked: 2026-03
        source: https://github.com/velvet-os/imagebuilder/issues/136
      keyboard:
        state: partial
        note: The keyboard types on the velvet-os images but is flaky. Owners report phantom key presses, a flood of log messages that costs processor time, and no keyboard input in Wayland desktops, where it is taken for a tablet.
        checked: 2026-06
        source: https://github.com/velvet-os/imagebuilder/issues/136
      touchpad:
        state: partial
        note: Reports disagree. The velvet-os status list has the touchpad working, while another owner's notes from 2026 have it not working.
        checked: 2026-10
        source: https://github.com/velvet-os/imagebuilder/issues/136
      wifi:
        state: works
        note: Wi-Fi works on the velvet-os images after the firmware files from Windows are installed.
        checked: 2025-05
        source: https://github.com/velvet-os/imagebuilder/issues/136
      bluetooth:
        state: partial
        note: Bluetooth works on the velvet-os images only after a service sets the adapter's address at every start. Owners then use Bluetooth headsets.
        checked: 2026-04
        source: https://github.com/velvet-os/imagebuilder/issues/136
      speakers:
        state: broken
        note: No sound from the built-in speakers on the velvet-os images. In September 2026 owners still had no update.
        checked: 2026-09
        source: https://github.com/velvet-os/imagebuilder/issues/136
      battery:
        state: partial
        note: The velvet-os images show no battery state. Per the author of Omarchy's tree, an owner has since read the battery gauge with the kernel's standard smart battery driver, which the tree now describes. Not confirmed on Omarchy yet.
        checked: 2026-11
        source: https://github.com/omacom/omarchy-pkgs/blob/master/pkgbuilds/linux-omarchy-dtbs/0050-arm64-dts-qcom-Add-the-Samsung-Galaxy-Book-Go.patch
      charging:
        state: broken
        note: Per the author of Omarchy's tree, the charger chip stops charging about three minutes after it was last set up, and Linux has no driver for it yet.
        checked: 2026-11
        source: https://github.com/omacom/omarchy-pkgs/blob/master/pkgbuilds/linux-omarchy-dtbs/0050-arm64-dts-qcom-Add-the-Samsung-Galaxy-Book-Go.patch
      suspend:
        state: broken
        note: Sleep and wake are listed as not working on the velvet-os images.
        checked: 2023-03
        source: https://github.com/velvet-os/imagebuilder/issues/136
      usb:
        state: partial
        note: USB works on the velvet-os images, but some devices are only seen if they are plugged in before the laptop starts.
        checked: 2023-03
        source: https://github.com/velvet-os/imagebuilder/issues/136
      modem:
        state: broken
        note: The LTE modem of the NP345XLA model is listed as not working on the velvet-os images.
        checked: 2023-03
        source: https://github.com/velvet-os/imagebuilder/issues/136

