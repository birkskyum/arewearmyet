    details: It comes in three variants, the SQ1 with LTE, the SQ2 with LTE and a Wi-Fi only model. The keyboard, touchpad and battery go through Microsoft's embedded controller, and Wi-Fi runs inside the modem firmware, so Wi-Fi fails whenever the modem does not start. The fullest owner report is from an SQ1 with LTE on Ubuntu 26.04 with a development kernel and patches that are not in any release yet, so a stock kernel shows less. Omarchy's packaging notes say it had not been booted in Omarchy.
    links:
      - title: linux-surface status report for the SQ1, November 2026
        url: https://github.com/linux-surface/surface-pro-x/issues/55
      - title: linux-surface test report for the SQ1 on the posted device tree
        url: https://github.com/linux-surface/surface-pro-x/issues/53
      - title: linux-surface issue on the modem crash loop and its rmtfs fix
        url: https://github.com/linux-surface/surface-pro-x/issues/54
      - title: linux-surface issue on Surface Pro X audio
        url: https://github.com/linux-surface/surface-pro-x/issues/21
      - title: Kernel list test of the posted device tree on a Wi-Fi SQ2
        url: https://lore.kernel.org/all/9c17de44-8c69-432a-a196-90a4765be871@gmail.com/
    checks:
      display:
        state: partial
        note: On Ubuntu 26.04 with a 7.4 development kernel and extra patches, on an SQ1 with LTE, the screen runs at 2880x1920. It needed the boot option deferred_probe_timeout=60, or the graphics driver gives up and the screen stays on the firmware's picture, and a panel entry that was merged in November 2026.
        version: Ubuntu 26.04, kernel 7.4-rc2 (linux-next) with extra patches
        checked: 2026-11
        source: https://github.com/linux-surface/surface-pro-x/issues/55#issuecomment-6865154454
      gpu:
        state: works
        note: On Ubuntu 26.04 with a 7.4 development kernel and extra patches, on an SQ1 with LTE, the GPU gives OpenGL 4.6 and Vulkan 1.3, with GPU firmware taken from Windows.
        version: Ubuntu 26.04, kernel 7.4-rc2 (linux-next) with extra patches
        checked: 2026-11
        source: https://github.com/linux-surface/surface-pro-x/issues/55#issuecomment-6865154454
      backlight:
        state: works
        note: On Ubuntu 26.04 with a 7.4 development kernel and extra patches, on an SQ1 with LTE, screen brightness works. The device tree's author also lists it as working.
        version: Ubuntu 26.04, kernel 7.4-rc2 (linux-next) with extra patches
        checked: 2026-11
        source: https://github.com/linux-surface/surface-pro-x/issues/55#issuecomment-6865154454
      keyboard:
        state: works
        note: On Ubuntu 26.04 with a 7.4 development kernel and extra patches, on an SQ1 with LTE, the Type Cover keyboard works through the Surface embedded controller.
        version: Ubuntu 26.04, kernel 7.4-rc2 (linux-next) with extra patches
        checked: 2026-11
        source: https://github.com/linux-surface/surface-pro-x/issues/55#issuecomment-6865154454
      touchpad:
        state: works
        note: On Ubuntu 26.04 with a 7.4 development kernel and extra patches, on an SQ1 with LTE, the Type Cover touchpad works through the Surface embedded controller.
        version: Ubuntu 26.04, kernel 7.4-rc2 (linux-next) with extra patches
        checked: 2026-11
        source: https://github.com/linux-surface/surface-pro-x/issues/55#issuecomment-6865154454
      touchscreen:
        state: partial
        note: On Ubuntu 26.04 with a 7.4 development kernel and extra patches, on an SQ1 with LTE, multitouch works with driver patches that are still under review. Now and then the touchscreen does not start at boot until its driver is reloaded. The pen was not tested.
        version: Ubuntu 26.04, kernel 7.4-rc2 (linux-next) with extra patches
        checked: 2026-11
        source: https://github.com/linux-surface/surface-pro-x/issues/55#issuecomment-6865154454
      wifi:
        state: partial
        note: On Ubuntu 26.04 with a 7.4 development kernel and extra patches, on an SQ1 with LTE, Wi-Fi works, but only once the modem firmware is kept running with a file-backed rmtfs setup, and it was slow on WPA3 networks until a firmware flag was fixed. On a Wi-Fi SQ2 with 7.4-rc1 it connected but passed no traffic until one kernel commit was reverted.
        version: Ubuntu 26.04, kernel 7.4-rc2 (linux-next) with extra patches
        checked: 2026-11
        source: https://github.com/linux-surface/surface-pro-x/issues/55#issuecomment-6865154454
      wifi-address:
        state: broken
        note: On two SQ1 units with a 7.4 development kernel, Wi-Fi came up with a random address because the driver found no valid one.
        version: kernel 7.4-rc2 (linux-next)
        checked: 2026-11
        source: https://github.com/linux-surface/surface-pro-x/issues/53
      bluetooth:
        state: partial
        note: On Ubuntu 26.04 with a 7.4 development kernel and extra patches, on an SQ1 with LTE, the Bluetooth firmware loads and the adapter comes up. Pairing and audio were not tested.
        version: Ubuntu 26.04, kernel 7.4-rc2 (linux-next) with extra patches
        checked: 2026-11
        source: https://github.com/linux-surface/surface-pro-x/issues/55#issuecomment-6865154454
      speakers:
        state: partial
        note: On Ubuntu 26.04 with a 7.4 development kernel and extra patches, on an SQ1 with LTE, the speakers work with audio patches that are not upstream. Volume is capped because there is no speaker protection, and the sound driver has to be loaded by hand.
        version: Ubuntu 26.04, kernel 7.4-rc2 (linux-next) with extra patches
        checked: 2026-11
        source: https://github.com/linux-surface/surface-pro-x/issues/55#issuecomment-6865154454
      microphones:
        state: partial
        note: On Ubuntu 26.04 with a 7.4 development kernel and extra patches, on an SQ1 with LTE, both built-in microphones work with audio patches that are not upstream. Their gain is low.
        version: Ubuntu 26.04, kernel 7.4-rc2 (linux-next) with extra patches
        checked: 2026-11
        source: https://github.com/linux-surface/surface-pro-x/issues/55#issuecomment-6865154454
      adsp:
        state: works
        note: On Ubuntu 26.04 with a 7.4 development kernel and extra patches, on an SQ1 with LTE, the audio DSP starts. The device tree's author also lists it as working.
        version: Ubuntu 26.04, kernel 7.4-rc2 (linux-next) with extra patches
        checked: 2026-11
        source: https://github.com/linux-surface/surface-pro-x/issues/55#issuecomment-6865154454
      battery:
        state: works
        note: On Ubuntu 26.04 with a 7.4 development kernel and extra patches, on an SQ1 with LTE, battery and charger status show through the Surface embedded controller.
        version: Ubuntu 26.04, kernel 7.4-rc2 (linux-next) with extra patches
        checked: 2026-11
        source: https://github.com/linux-surface/surface-pro-x/issues/55#issuecomment-6865154454
      suspend:
        state: broken
        note: On Ubuntu 26.04 with a 7.4 development kernel and extra patches, on an SQ1 with LTE, suspend does not work.
        version: Ubuntu 26.04, kernel 7.4-rc2 (linux-next) with extra patches
        checked: 2026-11
        source: https://github.com/linux-surface/surface-pro-x/issues/55#issuecomment-6865154454
      lid:
        state: works
        note: On Ubuntu 26.04 with a 7.4 development kernel and extra patches, on an SQ1 with LTE, the lid switch works with a device tree fix that is promised for the next posting.
        version: Ubuntu 26.04, kernel 7.4-rc2 (linux-next) with extra patches
        checked: 2026-11
        source: https://github.com/linux-surface/surface-pro-x/issues/55#issuecomment-6865154454
      usb:
        state: partial
        note: On Ubuntu 26.04 with a 7.4 development kernel and extra patches, on an SQ1 with LTE, USB devices work on the USB-C ports. Full speed in both plug orientations and the Surface Connect port were not tested, and the device tree's author lists USB 2.0 only.
        version: Ubuntu 26.04, kernel 7.4-rc2 (linux-next) with extra patches
        checked: 2026-11
        source: https://github.com/linux-surface/surface-pro-x/issues/55#issuecomment-6865154454
      external-display:
        state: broken
        note: On Ubuntu 26.04 with a 7.4 development kernel and extra patches, on an SQ1 with LTE, screens on USB-C do not work yet.
        version: Ubuntu 26.04, kernel 7.4-rc2 (linux-next) with extra patches
        checked: 2026-11
        source: https://github.com/linux-surface/surface-pro-x/issues/55#issuecomment-6865154454
      camera:
        state: partial
        note: On Ubuntu 26.04 with a 7.4 development kernel and extra patches, on an SQ1 with LTE, the front camera gives a picture through libcamera with out-of-tree camera patches. The rear camera does not work.
        version: Ubuntu 26.04, kernel 7.4-rc2 (linux-next) with extra patches
        checked: 2026-11
        source: https://github.com/linux-surface/surface-pro-x/issues/55#issuecomment-6865154454
      cdsp:
        state: works
        note: On Ubuntu 26.04 with a 7.4 development kernel and extra patches, on an SQ1 with LTE, the compute DSP starts. The device tree's author also lists it as working.
        version: Ubuntu 26.04, kernel 7.4-rc2 (linux-next) with extra patches
        checked: 2026-11
        source: https://github.com/linux-surface/surface-pro-x/issues/55#issuecomment-6865154454

