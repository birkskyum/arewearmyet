# What's known about each check past booting, kept by hand and reviewed like the
# model list. Owners' own runs of probe.sh come in through the API and show next to
# these on the model pages; this file holds what someone has looked at and written up.
#
# families: what holds across a chip family, shown on every model of it unless the
#   model's own finding says otherwise. Keys are generations from models.yaml.
# models: per model id
#   details   longer notes for the model page: what's specific to it, quirks, history
#   links     [{ title, url }] discussions, owner repos, write-ups
#   checks    { <check id>: { state, note, version, checked, source } }
#             state     works, partial, broken, untested or absent
#             note      what was seen, in a sentence or two
#             version   the linux-omarchy (or other kernel) version it was seen on
#             checked   the month, as YYYY-MM
#             source    a link to the report, discussion or pull request

families:
  x1:
    source: https://github.com/omacom/omarchy/discussions/11823
    checks:
      installer:
        state: works
        note: One nightly ARM image covers every supported machine and picks its packages during the install.
        checked: 2026-10
      suspend:
        state: partial
        note: Closing the lid enters the deepest sleep on Omarchy's kernel. On the Yoga, sleep started with the lid open ends by itself because the lid sensor gives a false signal during sleep (reported to Qualcomm).
        source: https://lore.kernel.org/r/179249856801.47858.11195411660636360454@pm.me
        checked: 2026-10
      hibernate:
        state: broken
        note: Waking from hibernation restarts the laptop. Fixes for the PCIe controller, the audio and battery processors, the pin settings and Bluetooth are with the Linux developers.
        source: https://github.com/omacom/omarchy/discussions/11823
        checked: 2026-10
      video-decode:
        state: works
        note: Omarchy's kernel carries the iris driver with Qualcomm's firmware crash fix (accepted for Linux 7.4), and Omarchy turns on hardware decoding for Snapdragon laptops (omarchy#15697).
        source: https://github.com/omacom/omarchy/pull/15697
        checked: 2026-10
      usb4:
        state: broken
        note: USB-C ports run at regular USB speed. Qualcomm's groundwork lands in Linux 7.4, but its main USB4 driver isn't published, so USB4 only runs with an experimental kernel.
        source: https://github.com/birkskyum/yoga-slim7x-usb4
        checked: 2026-10
  x2:
    checks:
      gpu:
        state: partial
        note: The 18-core Glymur chips have GPU support. Mahua and Kalambo trees ship with the GPU off until Mahua GPU support (in linux-next) and Mesa 26.3 land, so those machines need LIBGL_ALWAYS_SOFTWARE=1 in /etc/environment to reach the desktop.
        checked: 2026-11
      usb4:
        state: partial
        note: The Surface Laptop 8 13.8" runs USB4 on both USB-C ports on linux-omarchy 7.3-67 and later, with PCIe tunnelling since omarchy-pkgs#2880.
        source: https://github.com/omacom/omarchy-pkgs/pull/2880
        checked: 2026-11

models:
  lenovo-yoga-slim-7x-14q8x9:
    details: |
      The team's main test machine, the 83ED with a first-generation X Elite, tested with BIOS NHCN62WW. Lenovo's compute DSP firmware is in linux-firmware since 21 October 2026 (merge request 1314) and comes with its next release; until then the installer copies it from Windows. The fan and temperature readings need a driver that is still under review. Kernels 7.2.9 to 7.2.11 stop the keyboard and touchpad; Linux 7.3 has Qualcomm's fix.
    links:
      - title: Omarchy on the Lenovo Yoga Slim 7x (discussion 10426)
        url: https://github.com/omacom/omarchy/discussions/10426
      - title: USB4 on the Yoga Slim 7x (experimental kernel)
        url: https://github.com/birkskyum/yoga-slim7x-usb4
    checks:
      installer: { state: works, note: "The nightly image starts and reaches the installer with keyboard and touchpad working.", version: "7.2.8", checked: 2026-10, source: "https://github.com/omacom/omarchy/discussions/10426" }
      disk-unlock: { state: works, version: "7.2.8", checked: 2026-10, source: "https://github.com/omacom/omarchy/discussions/10426" }
      display: { state: works, version: "7.3", checked: 2026-10, source: "https://github.com/omacom/omarchy/discussions/10426" }
      gpu: { state: works, version: "7.3", checked: 2026-10, source: "https://github.com/omacom/omarchy/discussions/10426" }
      keyboard: { state: works, note: "Works on 7.2.8 and on 7.3. Kernels 7.2.9 to 7.2.11 stop it.", version: "7.3", checked: 2026-10, source: "https://lore.kernel.org/r/179173732257.29426.7905170638383807320@pm.me" }
      touchpad: { state: works, version: "7.3", checked: 2026-10, source: "https://github.com/omacom/omarchy/discussions/10426" }
      wifi: { state: works, note: "Some warnings after waking from sleep. Since linux-omarchy 7.2.8-23 Wi-Fi no longer stalls when the router changes its channel width.", version: "7.2.8-23", checked: 2026-10, source: "https://github.com/omacom/omarchy-pkgs/pull/1388" }
      bluetooth: { state: works, version: "7.2.8", checked: 2026-10, source: "https://github.com/omacom/omarchy/discussions/10426" }
      speakers: { state: works, note: "Need a kernel setting for the speaker reset.", version: "7.2.8", checked: 2026-10, source: "https://github.com/archlinuxarm/PKGBUILDs/pull/2217" }
      microphones: { state: works, note: "Record since linux-omarchy 7.2.8-20.", version: "7.2.8-20", checked: 2026-10, source: "https://github.com/omacom/omarchy-pkgs/pull/1276" }
      adsp: { state: works, note: "Starts from the firmware Linux ships.", version: "7.2.8", checked: 2026-10 }
      battery: { state: works, version: "7.2.8", checked: 2026-10 }
      cdsp: { state: partial, note: "Lenovo's firmware is in linux-firmware since 21 October and reaches the laptop with its next release; until then it comes from Windows.", checked: 2026-10, source: "https://gitlab.com/kernel-firmware/linux-firmware/-/merge_requests/1314" }
      fans: { state: partial, note: "The laptop's firmware runs the fans and they respond to load. The temperatures can be read (59 sensors on 7.3-59). The fan speed can't yet: its driver is under review.", version: "7.3-59", checked: 2026-11 }
      suspend: { state: partial, note: "Closing the lid enters the deepest sleep since linux-omarchy 7.2.8-19. Sleep started with the lid open ends by itself after about 15 seconds on the charger or 5 minutes on battery.", version: "7.2.8-19", checked: 2026-10, source: "https://github.com/omacom/omarchy-pkgs/pull/1315" }
      hibernate: { state: broken, note: "Waking from hibernation restarts the laptop.", checked: 2026-10, source: "https://github.com/omacom/omarchy/discussions/11823" }
      camera: { state: partial, note: "Works since linux-omarchy 7.2.8-20, with a pale picture until libcamera has tuning for its sensor.", version: "7.2.8-21", checked: 2026-10, source: "https://github.com/omacom/omarchy-pkgs/pull/1277" }
      video-decode: { state: works, note: "H.264, HEVC, VP9 and AV1 in mpv and Chromium. 1080p takes about a fifth of the processor in mpv.", checked: 2026-10 }
      usb4: { state: partial, note: "Only with an experimental kernel, on one port.", checked: 2026-10, source: "https://github.com/birkskyum/yoga-slim7x-usb4" }

