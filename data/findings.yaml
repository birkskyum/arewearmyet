# What's known about each check past booting, kept by hand and reviewed like the
# model list. Owners' own runs of probe.sh come in through the API and show next to
# these on the model pages; this file holds what someone has looked at and written up.
#
# families: what holds across a chip family, shown on every model of it unless the
#   model's own finding says otherwise. Keys are generations from models.yaml.
# models: per model id
#   details   longer notes for the model page: what's specific to it, quirks, history
#   links     [{ title, url }] discussions, owner repos, write-ups
#   checks    { <check id>: { state, note, version, checked, source } }
#             state     works, partial, broken, untested or absent
#             note      what was seen, in a sentence or two
#             version   the linux-omarchy (or other kernel) version it was seen on
#             checked   the month, as YYYY-MM
#             source    a link to the report, discussion or pull request
#             basis     what it rests on: omarchy (seen on Omarchy), other-distro (seen on another
#                       distro), tree-author (said by the device tree's author of their own
#                       kernel) or maker-spec (the maker's description of the model). Only
#                       omarchy and maker-spec count as the model's status on the site. Left
#                       out for the team's own notes, which have no public source.
#             where     where and when it was seen, as the source says
#             quote     the passage of the source it rests on, word for word. Required with
#                       a basis. `node scripts/quotes.ts` checks each one stands in its source.
#             under     for a quote that is one item of a list, the line that leads the list in

families:
  x1:
    source: https://github.com/omacom/omarchy/discussions/11823
    checks:
      installer:
        state: works
        note: One nightly ARM image covers every supported machine and picks its packages during the install.
        checked: 2026-10
        source: https://github.com/omacom/omarchy/discussions/11823
        basis: omarchy
        where: Omarchy on ARM, October 2026
        quote: One image covers every supported ARM machine and picks the right packages during the install.
      suspend:
        state: partial
        note: Closing the lid enters the deepest sleep on Omarchy's kernel. On the Yoga, sleep started with the lid open ends by itself because the lid sensor gives a false signal during sleep (reported to Qualcomm).
        source: https://lore.kernel.org/r/179249856801.47858.11195411660636360454@pm.me
        checked: 2026-10
        basis: omarchy
        where: linux-omarchy 7.2.8 with the sleep changes of 7.3, on a Yoga Slim 7x, October 2026
        quote: With the lid open the system resumes by itself every time the SoC leaves CXPC.
      hibernate:
        state: broken
        note: Waking from hibernation restarts the laptop. Fixes for the PCIe controller, the audio and battery processors, the pin settings and Bluetooth are with the Linux developers.
        source: https://github.com/omacom/omarchy/discussions/11823
        checked: 2026-10
        basis: omarchy
        where: Omarchy on a Yoga Slim 7x, October 2026
        quote: Waking from hibernation restarts the laptop.
      video-decode:
        state: works
        note: Omarchy's kernel ships the video chip's driver, and Omarchy turns on hardware decoding in mpv and Chromium on Snapdragon laptops (omarchy#15697). Tested on a Yoga Slim 7x.
        source: https://github.com/omacom/omarchy/pull/15697
        checked: 2026-10
        basis: omarchy
        where: linux-omarchy 7.2.8 on a Yoga Slim 7x, October 2026
        quote: Frames decoded on the video chip match software decoding for H.264, HEVC and VP9, also after idle pauses.
      usb4:
        state: broken
        note: USB-C ports run at regular USB speed. USB4 only runs with an experimental kernel, on the Yoga's left rear port, and that kernel is not a release.
        source: https://github.com/birkskyum/yoga-slim7x-usb4
        checked: 2026-10
        basis: omarchy
        where: An experimental kernel on Omarchy, Yoga Slim 7x, September 2026
        quote: Only the left rear port runs, and this is still not a release.
  x2:
    checks:
      gpu:
        state: partial
        note: The 18-core Glymur chips have GPU support. Mahua and Kalambo trees ship with the GPU off until Mahua GPU support (in linux-next) and Mesa 26.3 land, so those machines need LIBGL_ALWAYS_SOFTWARE=1 in /etc/environment to reach the desktop.
        checked: 2026-11
      usb4:
        state: partial
        note: On the Surface Laptop 8 13.8-inch both USB-C ports run USB4, and the PCIe devices of a dock or an NVMe enclosure appear since omarchy-pkgs#2880. No other X2 model has been tested.
        source: https://github.com/omacom/omarchy-pkgs/pull/2880
        checked: 2026-11
        basis: omarchy
        where: linux-omarchy on a Surface Laptop 8 13.8-inch, November 2026
        quote: The PCIe devices of a USB4 or Thunderbolt dock, and the drive in a USB4 NVMe enclosure, now appear on the Surface Laptop 8, on both USB-C ports.

models:
  lenovo-yoga-slim-7x-14q8x9:
    details: |
      The team's main test machine, the 83ED with a first-generation X Elite, tested with BIOS NHCN62WW. Lenovo's compute DSP firmware is in linux-firmware since 21 October 2026 (merge request 1314) and comes with its next release; until then the installer copies it from Windows. The fan and temperature readings need a driver that is still under review. Kernels 7.2.9 to 7.2.11 stop the keyboard and touchpad; Linux 7.3 has Qualcomm's fix.
    links:
      - title: Omarchy on the Lenovo Yoga Slim 7x (discussion 10426)
        url: https://github.com/omacom/omarchy/discussions/10426
      - title: USB4 on the Yoga Slim 7x (experimental kernel)
        url: https://github.com/birkskyum/yoga-slim7x-usb4
    checks:
      installer: { state: works, note: "The nightly image starts and reaches the installer with keyboard and touchpad working.", version: "7.2.8", checked: 2026-10, source: "https://github.com/omacom/omarchy/discussions/10426", basis: omarchy, where: "Omarchy nightly image 2026.10.16.448, linux-omarchy 7.2.8", quote: "It starts from a USB stick on my Yoga Slim 7x (83ED) and reaches the installer, the keyboard and touchpad work there, and it recognizes the laptop as a Snapdragon." }
      disk-unlock: { state: works, version: "7.2.8", checked: 2026-10, source: "https://github.com/omacom/omarchy/discussions/10426", note: "", basis: omarchy, where: "Omarchy on linux-omarchy 7.2.8, page updated 21 October 2026", quote: Unlocking the encrypted disk at startup | ✅ | Works. }
      display: { state: works, version: "7.3", checked: 2026-10, source: "https://github.com/omacom/omarchy/discussions/10426", note: "", basis: omarchy, where: "Omarchy's kernel 7.2.8 and Linux 7.3, page updated 21 October 2026", quote: "Desktop, graphics, keyboard and touchpad | ✅ | On Omarchy's kernel, which is on 7.2.8, and on Linux 7.3." }
      gpu: { state: works, version: "7.3", checked: 2026-10, source: "https://github.com/omacom/omarchy/discussions/10426", note: "", basis: omarchy, where: "Omarchy's kernel 7.2.8 and Linux 7.3, page updated 21 October 2026", quote: "Desktop, graphics, keyboard and touchpad | ✅ | On Omarchy's kernel, which is on 7.2.8, and on Linux 7.3." }
      keyboard: { state: works, note: "Works on kernel 7.2.8, and on 7.3 with the fix that went into it. A change in kernel 7.2.9 stops the keyboard and touchpad, also at the disk password prompt.", version: "7.3", checked: 2026-10, source: "https://lore.kernel.org/r/179173732257.29426.7905170638383807320@pm.me", basis: other-distro, where: "A distribution build of Linux 7.2.8, and 7.3-rc7 with the fix, October 2026", quote: To narrow it down I took a 7.2.8 kernel that works on this laptop and }
      touchpad: { state: works, version: "7.3", checked: 2026-10, source: "https://github.com/omacom/omarchy/discussions/10426", note: "", basis: omarchy, where: "Omarchy's kernel 7.2.8 and Linux 7.3, page updated 21 October 2026", quote: "Desktop, graphics, keyboard and touchpad | ✅ | On Omarchy's kernel, which is on 7.2.8, and on Linux 7.3." }
      wifi: { state: works, note: "Since linux-omarchy 7.2.8-23 Wi-Fi no longer stalls for minutes after the router changes its channel or channel width.", version: "7.2.8-23", checked: 2026-10, source: "https://github.com/omacom/omarchy-pkgs/pull/1388", basis: omarchy, where: "linux-omarchy 7.2.8-23, 2026-10-20", quote: The 7.2.8-23 package on the Yoga connected to Wi-Fi with no stats timeouts. }
      bluetooth: { state: works, version: "7.2.8", checked: 2026-10, source: "https://github.com/omacom/omarchy/discussions/10426", note: Works. Bluetooth audio hasn't been tested., basis: omarchy, where: "Omarchy on linux-omarchy 7.2.8, page updated 21 October 2026", quote: Wi-Fi and Bluetooth | ✅ | Some Wi-Fi warnings after waking from sleep. }
      speakers: { state: works, note: "The internal speakers play once the kernel has the reset-gpio driver (CONFIG_RESET_GPIO). Without it the four amplifiers, which sit on two shared reset lines, stay silent.", version: "7.2.8", checked: 2026-10, source: "https://github.com/archlinuxarm/PKGBUILDs/pull/2217", basis: other-distro, where: "Arch Linux ARM, linux-aarch64 rebuilt with CONFIG_RESET_GPIO=m, 2026-08-28", quote: "after reboot, `speaker-test -D pipewire -c 2 -t sine -f 440 -l 1` produced audible output from the internal speakers" }
      microphones: { state: works, note: "The built-in microphones record with the fix in Omarchy's kernel. Before it every capture failed.", version: "7.2.8-20", checked: 2026-10, source: "https://github.com/omacom/omarchy-pkgs/pull/1276", basis: omarchy, where: "linux-omarchy 7.2.8 with the pull request's patch, 2026-10-18", quote: "Tested on a Yoga Slim 7x. Capture works through PipeWire and with direct captures of two, four and two channels in a row." }
      adsp: { state: works, note: "Starts from the firmware Linux ships.", version: "7.2.8", checked: 2026-10 }
      battery: { state: works, version: "7.2.8", checked: 2026-10 }
      cdsp: { state: partial, note: "Lenovo's firmware is in linux-firmware since 21 October 2026 and reaches the laptop with its next release.", checked: 2026-10, source: "https://github.com/omacom/omarchy/discussions/10426", basis: omarchy, where: "Omarchy on the team's Yoga Slim 7x, October 2026", quote: Lenovo's firmware is in Linux's firmware since 21 October and reaches the laptop with its next release }
      fans: { state: partial, note: "The laptop's firmware runs the fans and they respond to load. The temperatures can be read (59 sensors on 7.3-59). The fan speed can't yet: its driver is under review.", version: "7.3-59", checked: 2026-11 }
      suspend: { state: partial, note: "Closing the lid enters the deepest sleep since linux-omarchy 7.2.8-19. Sleep started with the lid open ends by itself after about 15 seconds on the charger or 5 minutes on battery.", version: "7.2.8-19", checked: 2026-10, source: "https://github.com/omacom/omarchy/discussions/10426", basis: omarchy, where: "Omarchy on the team's Yoga Slim 7x, October 2026", quote: Sleep started with the lid open ends by itself after about 15 seconds on the charger or about 5 minutes on battery }
      hibernate: { state: broken, note: "Waking from hibernation restarts the laptop.", checked: 2026-10, source: "https://github.com/omacom/omarchy/discussions/11823", basis: omarchy, where: "Omarchy on the Yoga Slim 7x, page updated 21 October 2026", quote: Hibernation | ❌ | Waking from hibernation restarts the laptop. }
      camera: { state: works, note: "Works since linux-omarchy 7.2.8-20, and Chromium shows live video with the privacy light on. About 1 in 100 camera starts still times out.", version: "7.2.8-21", checked: 2026-10, source: "https://github.com/omacom/omarchy-pkgs/pull/1277", basis: omarchy, where: "linux-omarchy 7.2.8-20, 2026-10-18", quote: "A capture after 60 s with the panel off works, and Chromium shows upright live video with the privacy LED on." }
      video-decode: { state: works, note: "H.264, HEVC, VP9 and AV1 in mpv and Chromium. 1080p takes about a fifth of the processor in mpv.", checked: 2026-10 }
      usb4: { state: partial, note: "Only with an experimental kernel, on one port.", checked: 2026-10, source: "https://github.com/birkskyum/yoga-slim7x-usb4", basis: other-distro, where: "Omarchy with a self-built experimental USB4 kernel, 2026-09 to 2026-10", quote: "the left rear port runs, and this is still not a release." }

