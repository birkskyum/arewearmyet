      - title: "HUMAIN OS: USB-C screens across sleep"
        url: https://github.com/humain-os/humain-dtb/pull/13

  lenovo-thinkpad-x13s-gen-1:
    details: The X13s is the best covered 8cx Gen 3 laptop and has been in Linux since 6.0. An owner runs Omarchy 4.5 on it with graphics, Wi-Fi, Bluetooth, sound, the fingerprint reader and battery readings working, and reports three open problems, which are sleep, one USB-C port and a warning about the screen panel. Lenovo's firmware needs the Linux Boot setting turned on and Secure Boot turned off. Older reports from Debian add that the Wi-Fi and Bluetooth addresses are not read from the laptop, so they have to be set by hand.
    links:
      - title: "Omarchy issue: ThinkPad X13s sleep, USB-C and panel problems"
        url: https://github.com/omacom/omarchy/issues/18983
      - title: "Debian wiki: Debian on the ThinkPad X13s"
        url: https://wiki.debian.org/InstallingDebianOn/Thinkpad/X13s
      - title: "postmarketOS wiki: Lenovo ThinkPad X13s"
        url: https://wiki.postmarketos.org/wiki/Lenovo_ThinkPad_X13s_(lenovo-21bx)
      - title: "aarch64-laptops: ThinkPad X13s status by kernel version"
        url: https://aarch64-laptops.github.io/laptop/thinkpad-x13s
      - title: "Gentoo wiki: ThinkPad X13s"
        url: https://wiki.gentoo.org/wiki/ThinkPad_X13s
    checks:
      disk-unlock:
        state: works
        note: On postmarketOS, full disk encryption is listed as working on this laptop. The Omarchy owner also runs an encrypted install.
        checked: 2026-09
        source: https://wiki.postmarketos.org/wiki/Lenovo_ThinkPad_X13s_(lenovo-21bx)
      display:
        state: works
        note: The built-in 1920x1200 screen works. On units with the LG panel the kernel does not know the panel and logs a warning at every start, with no visible effect.
        version: Omarchy 4.5.0, linux-omarchy 7.3
        checked: 2026-11
        source: https://github.com/omacom/omarchy/issues/18983
      gpu:
        state: works
        note: The desktop runs on the Adreno 690 with Mesa 26.2.
        version: Omarchy 4.5.0, linux-omarchy 7.3
        checked: 2026-11
        source: https://github.com/omacom/omarchy/issues/18983
      backlight:
        state: works
        note: On Debian the brightness keys work. Under X11 the brightness has to be set with a tool such as xbacklight, Wayland is not affected.
        checked: 2026-11
        source: https://wiki.debian.org/InstallingDebianOn/Thinkpad/X13s
      keyboard:
        state: partial
        note: The keyboard types. On Debian, of the special keys only the volume and brightness keys do something.
        checked: 2026-11
        source: https://wiki.debian.org/InstallingDebianOn/Thinkpad/X13s
      touchpad:
        state: works
        note: On Debian the touchpad and the TrackPoint both work.
        checked: 2026-11
        source: https://wiki.debian.org/InstallingDebianOn/Thinkpad/X13s
      touchscreen:
        state: works
        note: On postmarketOS the touchscreen is listed as working. Only some X13s units have one.
        checked: 2026-09
        source: https://wiki.postmarketos.org/wiki/Lenovo_ThinkPad_X13s_(lenovo-21bx)
      wifi:
        state: works
        note: Wi-Fi works on Omarchy.
        version: Omarchy 4.5.0, linux-omarchy 7.3
        checked: 2026-11
        source: https://github.com/omacom/omarchy/issues/18983
      wifi-address:
        state: partial
        note: On Debian the Wi-Fi card gets a random address at every start. A udev rule that sets the address Windows shows is the documented workaround.
        checked: 2026-11
        source: https://wiki.debian.org/InstallingDebianOn/Thinkpad/X13s
      bluetooth:
        state: partial
        note: Bluetooth works on Omarchy with its address set by the owner's local helper package. The Debian wiki says Bluetooth does not work until an address is set.
        version: Omarchy 4.5.0, linux-omarchy 7.3
        checked: 2026-11
        source: https://github.com/omacom/omarchy/issues/18983
      speakers:
        state: works
        note: Sound works on Omarchy. The owner's local helper package also sets the speaker gain.
        version: Omarchy 4.5.0, linux-omarchy 7.3
        checked: 2026-11
        source: https://github.com/omacom/omarchy/issues/18983
      battery:
        state: works
        note: Battery readings work on Omarchy.
        version: Omarchy 4.5.0, linux-omarchy 7.3
        checked: 2026-11
        source: https://github.com/omacom/omarchy/issues/18983
      suspend:
        state: partial
        note: On Omarchy the laptop froze when going to sleep and had to be reset, seen once, and the owner turned off sleep on lid close. The Debian wiki reports that sleep works.
        version: Omarchy 4.5.0, linux-omarchy 7.3
        checked: 2026-11
        source: https://github.com/omacom/omarchy/issues/18983
      suspend-drain:
        state: broken
        note: On Debian, sleep empties the battery in about a day.
        checked: 2026-11
        source: https://wiki.debian.org/InstallingDebianOn/Thinkpad/X13s
      hibernate:
        state: broken
        note: On Debian, hibernation is listed as unsupported.
        checked: 2026-11
        source: https://wiki.debian.org/InstallingDebianOn/Thinkpad/X13s
      lid:
        state: works
        note: On postmarketOS the lid sensor is listed as working.
        checked: 2026-09
        source: https://wiki.postmarketos.org/wiki/Lenovo_ThinkPad_X13s_(lenovo-21bx)
      usb:
        state: partial
        note: On Omarchy one of the two USB-C ports had no USB data on 4 of 7 starts, because its controller failed to start. Loading it by hand after start-up worked. The other ports worked every time.
        version: Omarchy 4.5.0, linux-omarchy 7.3
        checked: 2026-11
        source: https://github.com/omacom/omarchy/issues/18983
      external-display:
        state: works
        note: On Debian, common USB-C display adapters work on both USB-C ports for one external monitor. DisplayLink docks need DisplayLink's own driver.
        checked: 2026-11
        source: https://wiki.debian.org/InstallingDebianOn/Thinkpad/X13s
      camera:
        state: partial
        note: On postmarketOS the webcam works with a yellowish picture, because the image is processed on the processor. The infrared camera for face login is not supported. The Debian wiki reports the camera working only once per use.
        checked: 2026-09
        source: https://wiki.postmarketos.org/wiki/Lenovo_ThinkPad_X13s_(lenovo-21bx)
      fingerprint:
        state: works
        note: The fingerprint reader in the power button works on Omarchy.
        version: Omarchy 4.5.0, linux-omarchy 7.3
        checked: 2026-11
        source: https://github.com/omacom/omarchy/issues/18983
      modem:
        state: works
        note: On Debian the 5G modem connects after ModemManager's FCC unlock script is enabled and the SIM PIN is removed.
        checked: 2026-11
        source: https://wiki.debian.org/InstallingDebianOn/Thinkpad/X13s

