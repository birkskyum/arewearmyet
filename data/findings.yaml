  microsoft-surface-pro-9-5g:
    details: A tablet whose keyboard and touchpad are the detachable Type Cover, reached through Microsoft's own embedded controller. The first device tree, in kernel 6.13, ran without the built-in screen. A round of changes in kernel 7.3 added the screen, brightness control, the lid sensor, the volume keys and DisplayPort on both USB-C ports. Speakers, microphones and the touchscreen were listed as missing in the first device tree, and no later kernel commit for this tablet says they work.
    links:
      - title: linux-surface thread on the Surface Pro 9 5G
        url: https://github.com/linux-surface/surface-pro-x/issues/46
    checks:
      display:
        state: works
        note: The device tree's author enabled the built-in screen in kernel 7.3. Before that the tablet only showed the firmware's picture.
        version: "7.3"
        checked: 2026-07
        source: https://github.com/torvalds/linux/commit/587ea6a79584
      backlight:
        state: works
        note: Brightness can be changed with the brightness keys of the Type Cover, per the commit that added it.
