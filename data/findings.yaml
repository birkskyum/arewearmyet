  tcl-book-14-go:
    details: The one public report is from an owner who wrote a first device tree for it in May 2023 and started Linux with the screen on the firmware's picture. The internal UFS storage did not work for them then. Starting the laptop with another model's device tree upset its keyboard controller until a hard reset, also in the firmware and in Windows. Its display bridge is a different chip from the Acer Aspire 1's, so that laptop's tree cannot drive the panel. Omarchy's tree has not been run on the laptop yet.
    links:
      - title: "velvet-os: Snapdragon 7c Windows laptops status"
        url: https://github.com/velvet-os/imagebuilder/issues/136
    checks:
      display:
        state: works
        note: With an owner's own device tree in 2023, the built-in screen showed the picture the firmware sets up. The kernel could not drive the panel itself.
