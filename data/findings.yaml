        quote: "- ADSP and CDSP"
        under: "Supported features:"
      battery:
        state: works
        note: On Ubuntu 26.04, battery readings work on an X Plus unit once the laptop's firmware is installed.
        version: Ubuntu 26.04
        checked: 2026-07
        source: https://bugs.launchpad.net/ubuntu-concept/+bug/2092951/comments/16
        basis: other-distro
        where: Ubuntu 26.04, on a 14-fe1 with Snapdragon X Plus, July 2026
        quote: "- Battery info"
        under: "After some tweaking involving manual copying of firmware blobs, here are the results:"
      lid:
        state: partial
        note: The lid switch is detected, and with the default setting closing the lid still sleeps. Omarchy's own lid actions, such as locking and handing the desktop to an external screen, do not run, because they look for a switch with another name. A fix is proposed.
        version: linux-omarchy 7.3-49
        checked: 2026-11
        source: https://github.com/omacom/omarchy/issues/19298
        basis: omarchy
        where: Omarchy edge, linux-omarchy 7.3-49
        quote: "closing the lid does nothing: the session doesn't lock and the panel stays on."
      usb:
        state: works
        note: On Ubuntu 26.04, storage mounted on every USB port of an X Plus unit.
        version: Ubuntu 26.04
        checked: 2026-07
        source: https://bugs.launchpad.net/ubuntu-concept/+bug/2092951/comments/16
        basis: other-distro
        where: Ubuntu 26.04, on a 14-fe1 with Snapdragon X Plus, July 2026
        quote: "- Mounting storage attached to all available USB ports"
        under: "After some tweaking involving manual copying of firmware blobs, here are the results:"
      external-display:
        state: partial
        note: A 4K monitor on the second USB-C port connected in DisplayPort mode and played sound, but the report does not say whether it showed a picture. After boot the monitor's sound output can be missing until the sound services are restarted.
        version: linux-omarchy 7.3-20
        checked: 2026-11
        source: https://github.com/omacom/omarchy/issues/17396#issuecomment-6694011382
        basis: omarchy
        where: linux-omarchy 7.3-20 from a test build, over stable Omarchy
        quote: A 4K monitor was on the second USB-C port in DP alt mode
