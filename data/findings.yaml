  dell-latitude-7455:
    details: Two owners wrote the Latitude 7455 up in detail in autumn 2026, one on Omarchy 4.5 and one on Ubuntu 26.10. On Omarchy's stable channel with Windows wiped, the GPU and audio firmware had to be copied in by hand before the desktop, sound and battery worked. The edge channel has a firmware package for this model. Units differ. One has a touchscreen controller the device tree does not describe, and one has a panel whose brightness cannot be set. The colour webcam is not in the shipped device tree and the infrared camera has no driver.
    links:
      - title: Latitude 7455 on Omarchy 4.5, what it took
        url: https://github.com/omacom/omarchy/discussions/19382
      - title: Latitude 7455 on Ubuntu 26.10, a week of daily use
        url: https://discourse.ubuntu.com/t/latitude-7455-on-26-10-built-it-twice-used-it-for-a-week-heres-whats-left/89825
      - title: Hardware video decoding on the Latitude 7455
        url: https://discourse.ubuntu.com/t/ubuntu-concept-snapdragon-x-elite/48800/2154
    checks:
      installer:
        state: works
