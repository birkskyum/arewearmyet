  microsoft-windows-dev-kit-2023:
    details: A small desktop computer with no screen, keyboard or battery of its own, so it needs a monitor and a USB keyboard. In November 2026 an owner installed Omarchy on it and got it running with three workarounds. The USB driver dwc3-qcom-legacy went into the early boot image, the boot option regulator_ignore_unused keeps the mini DisplayPort output alive, and the graphics driver is loaded only after the disk is unlocked. Wi-Fi needs calibration data that linux-firmware does not carry yet.
    links:
      - title: Omarchy issue on the USB driver and boot option the Dev Kit needs
        url: https://github.com/omacom/omarchy/issues/18998
      - title: Omarchy issue on the Dev Kit's Wi-Fi board data
        url: https://github.com/omacom/omarchy/issues/18999
      - title: Omarchy issue on the black screen at the disk password prompt
        url: https://github.com/omacom/omarchy/issues/17327
      - title: Microsoft's Windows Dev Kit 2023 specifications
        url: https://learn.microsoft.com/en-us/windows/arm/dev-kit/
    checks:
      installer:
        state: partial
        note: The Omarchy edge installer of 14 November 2026 ran, but there was no USB until the dwc3-qcom-legacy driver was loaded, and the monitor on mini DisplayPort went dark about 30 seconds into boot without the boot option regulator_ignore_unused.
        version: Omarchy edge 2026.11.14, kernel 7.3.0-60-omarchy
        checked: 2026-11
        source: https://github.com/omacom/omarchy/issues/18998
      disk-unlock:
        state: partial
        note: With the stock setup the monitor goes black before the disk password prompt. The prompt stays visible with modprobe.blacklist=msm, and a USB keyboard types into it once dwc3-qcom-legacy is in the early boot image.
        version: Omarchy edge, kernel 7.3.0-63-omarchy
        checked: 2026-11
        source: https://github.com/omacom/omarchy/issues/17327#issuecomment-6896406345
      display:
        state: absent
        note: A desktop box without a screen of its own. Microsoft lists mini DisplayPort and two USB-C ports for monitors.
        checked: 2025-11
        source: https://learn.microsoft.com/en-us/windows/arm/dev-kit/
      gpu:
        state: partial
        note: The desktop runs on the Adreno 690 when the graphics driver is loaded after the disk is unlocked. Loaded early, it blanks the monitor.
        version: Omarchy edge, kernel 7.3.0-63-omarchy
        checked: 2026-11
        source: https://github.com/omacom/omarchy/issues/17327#issuecomment-6896406345
      backlight:
        state: absent
        note: There is no built-in screen.
        checked: 2025-11
        source: https://learn.microsoft.com/en-us/windows/arm/dev-kit/
      keyboard:
        state: absent
        note: There is no built-in keyboard. Microsoft advises a keyboard on the USB-A ports.
        checked: 2025-11
        source: https://learn.microsoft.com/en-us/windows/arm/dev-kit/
      touchpad:
        state: absent
        note: There is no built-in touchpad.
        checked: 2025-11
        source: https://learn.microsoft.com/en-us/windows/arm/dev-kit/
      touchscreen:
        state: absent
        note: There is no built-in screen.
        checked: 2025-11
        source: https://learn.microsoft.com/en-us/windows/arm/dev-kit/
      wifi:
        state: partial
        note: With the stock firmware files it finds only 2.4 GHz networks and links at about 16 Mbit/s. With board data borrowed from the ThinkPad X13s it reached 5 GHz at 160 MHz. After a warm restart from Windows it lost 35 to 57 percent of packets until a full power-off.
        version: Omarchy edge, kernel 7.3.0-63-omarchy
        checked: 2026-11
        source: https://github.com/omacom/omarchy/issues/18999
      bluetooth:
        state: works
        note: Listed as supported by the device tree's author.
        version: "6.14"
        checked: 2024-12
        source: https://github.com/torvalds/linux/commit/16a7fed11714
      headphones:
        state: absent
        note: Microsoft lists USB, mini DisplayPort and Ethernet as its only ports, so there is no headphone jack.
        checked: 2025-11
        source: https://learn.microsoft.com/en-us/windows/arm/dev-kit/
      adsp:
        state: works
        note: Listed as supported by the device tree's author. Sound itself goes through USB audio devices.
        version: "6.14"
        checked: 2024-12
        source: https://github.com/torvalds/linux/commit/16a7fed11714
      battery:
        state: absent
        note: Microsoft states the device has no battery and runs only on its power supply.
        checked: 2025-11
        source: https://learn.microsoft.com/en-us/windows/arm/dev-kit/
      charging:
        state: absent
        note: There is no battery to charge. It runs from its own 90 W power supply.
        checked: 2025-11
        source: https://learn.microsoft.com/en-us/windows/arm/dev-kit/
      lid:
        state: absent
        note: A desktop box with no lid.
        checked: 2025-11
        source: https://learn.microsoft.com/en-us/windows/arm/dev-kit/
      usb:
        state: partial
        note: USB works once the dwc3-qcom-legacy driver is loaded, which Omarchy's setup does not add to the early boot image for this machine. The device tree's author lists the USB-A and USB-C ports as supported.
        version: Omarchy edge, kernel 7.3.0-63-omarchy
        checked: 2026-11
        source: https://github.com/omacom/omarchy/issues/18998
      external-display:
        state: partial
        note: A 1920x1080 monitor on the mini DisplayPort output works, but the output is cut about 30 seconds into boot unless regulator_ignore_unused is set.
        version: Omarchy edge, kernel 7.3.0-63-omarchy
        checked: 2026-11
        source: https://github.com/omacom/omarchy/issues/18998
      cdsp:
        state: works
        note: Listed as supported by the device tree's author.
        version: "6.14"
        checked: 2024-12
        source: https://github.com/torvalds/linux/commit/16a7fed11714

