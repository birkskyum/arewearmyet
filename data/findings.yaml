        source: https://github.com/omacom/omarchy/issues/17396#issuecomment-6809634181
        basis: omarchy
        where: Omarchy edge, linux-omarchy 7.3-49, linux-omarchy-dtbs 7.3-9
        quote: The live tree routes VA DMIC0/1 to MIC BIAS1, and both channels record.
