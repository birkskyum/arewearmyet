        checked: 2025-11
        source: https://learn.microsoft.com/en-us/windows/arm/dev-kit/
        basis: maker-spec
        where: Microsoft's Dev Kit 2023 page, last updated 2025-11-07
        quote: "Ports: 3x USB-A, 2x USB-C, Mini-Display (HBR2 support), Ethernet (RJ45)"
