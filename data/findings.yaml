        checked: 2024-10
        source: https://github.com/torvalds/linux/commit/f6231a2eefd4
      speakers:
        state: broken
        note: The device tree's author listed the speakers as not supported yet. Sound came out only through Bluetooth headsets or USB audio.
        version: "6.13"
        checked: 2024-10
        source: https://github.com/torvalds/linux/commit/f6231a2eefd4
      microphones:
        state: broken
        note: The device tree's author listed the built-in microphones as not supported yet.
        version: "6.13"
        checked: 2024-10
        source: https://github.com/torvalds/linux/commit/f6231a2eefd4
      charging:
