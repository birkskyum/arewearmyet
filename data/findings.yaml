  humain-horizon:
    details: The public notes on Linux for it come from the device tree repository of HUMAIN OS, the maker's own Linux system. Its changes there fix the touchscreen, the camera, a silent right speaker, the hardware clock and screens on USB-C, and are described as tested on the Glymur CRD or Horizon Ultra X board with HUMAIN OS's own 7.2 kernel. They do not say which results are from a Horizon as sold, so no single check is recorded from them.
    links:
      - title: HUMAIN OS device tree repository
