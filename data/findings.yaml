  hp-omnibook-3-14-hz0:
    details: Two device trees cover it, one for the OLED panel and one for the LCD, and Omarchy picks between them by the laptop's SKU. Owners in the community kernel's bring-up thread run it daily on Ubuntu 26.04 and on Arch with their own kernels. They report graphics acceleration, HDMI output, both cameras, battery readings with the 80% charge limit, and sleep and wake working there, and a screen on USB-C, fan speed readings and hibernation not working. On Omarchy only the speakers and microphones are confirmed so far.
    links:
      - title: "Omarchy packages: speakers and microphones for the OmniBook 3 14"
        url: https://github.com/omacom/omarchy-pkgs/pull/2756
      - title: "Omarchy packages issue: touchpad at a second address on some units"
        url: https://github.com/omacom/omarchy-pkgs/issues/2755
      - title: "Omarchy issue: an OmniBook 3 that did not start the early November 2026 image (size not stated)"
        url: https://github.com/omacom/omarchy/issues/18209
    checks:
      backlight:
        state: partial
        note: Owners on a community Ubuntu kernel report the brightness controls working. One OLED owner had no brightness control until the panel was handed to the Samsung OLED driver, which Omarchy's tree uses. It is not confirmed on Omarchy yet.
        checked: 2026-11
        source: https://github.com/omacom/omarchy-pkgs/pull/2263
      keyboard:
        state: works
        note: Owners running Ubuntu with a community kernel report the keyboard working with this device tree.
        checked: 2026-11
        source: https://github.com/omacom/omarchy-pkgs/pull/2263
      touchpad:
        state: partial
        note: One owner's touchpad stayed dead until the device tree pointed at a second touchpad part at another address. Omarchy's tree describes only the first part, so units with the second one have no touchpad.
        checked: 2026-11
        source: https://github.com/omacom/omarchy-pkgs/issues/2755
      wifi:
        state: partial
        note: linux-firmware has no calibration data for its Wi-Fi card. An owner on Ubuntu got a working connection by pointing the card at a similar card's data. Omarchy now installs such a stand-in, which is not confirmed on this laptop yet.
        checked: 2026-11
        source: https://github.com/omacom/omarchy-pkgs/pull/2753
      speakers:
        state: works
        note: With Omarchy's sound package both speakers play on the correct sides, tested at moderate volume. Another owner, on his own setup, reported the amplifiers cutting out when pushed hard.
        version: linux-omarchy 7.3.0-61
        checked: 2026-11
        source: https://github.com/omacom/omarchy-pkgs/pull/2756
      microphones:
        state: works
        note: The internal microphones record, after one pop at the start.
        version: linux-omarchy 7.3.0-61
        checked: 2026-11
        source: https://github.com/omacom/omarchy-pkgs/pull/2756
      headphones:
        state: works
        note: One owner on Ubuntu with a community kernel reports the headset working. The jack was not tried on Omarchy.
        checked: 2026-11
        source: https://github.com/omacom/omarchy-pkgs/issues/2754
      usb:
        state: works
        note: Owners running Ubuntu with a community kernel report the USB-C and USB-A ports working.
        checked: 2026-11
        source: https://github.com/omacom/omarchy-pkgs/pull/2263

  hp-omnibook-5-14-he0:
    details: Ubuntu's own Snapdragon images did not start on it in October 2025 and March 2026, since they carry no device tree for it. Owners in the community kernel's discussion thread run Ubuntu with a community kernel and this laptop's tree. In May 2026 one reported Wi-Fi (after adding calibration data by hand), the touchpad, graphics acceleration, speakers and the microphone working. An earlier report on a borrowed tree had the webcam and keyboard backlight not working. Nothing is confirmed on Omarchy yet.
    links:
      - title: "Ubuntu bug: Support HP OmniBook 5 14-he0"
        url: https://bugs.launchpad.net/ubuntu-concept/+bug/2130300

