        checked: 2026-11
        source: https://github.com/turbineBMW/omarchy-hardware-reports/issues/1
      keyboard:
        state: works
        note: The Return key moved the installer on to its next step. Other keys and the function row were not tried.
        version: edge test image 2026.11.06
        checked: 2026-11
        source: https://github.com/turbineBMW/omarchy-hardware-reports/issues/1
      speakers:
        state: broken
        note: The built-in speakers stay silent in Omarchy's image, because the device tree does not describe the laptop's sound yet. The owner only heard sound through a USB audio adapter.
        version: edge test image 2026.11.06
        checked: 2026-11
        source: https://github.com/turbineBMW/omarchy-hardware-reports/issues/1
      usb:
