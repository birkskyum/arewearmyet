  hp-omnibook-x-14-kr:
    details: |
      The 14-kr1 with the 6-core X2 Plus (Kalambo) chip. Its tree ships with the GPU off, so the desktop needs LIBGL_ALWAYS_SOFTWARE=1 in /etc/environment. The kernel picks deep sleep by default, which loses the Wi-Fi card on resume and restarts the laptop after a few cycles; s2idle is being tested.
    links:
      - title: Owner's hardware report and test thread
        url: https://github.com/turbineBMW/omarchy-hardware-reports/issues/45
    checks:
      gpu: { state: partial, note: "The GPU is off in its tree for now; the desktop runs on software rendering with LIBGL_ALWAYS_SOFTWARE=1.", version: "7.3-72", checked: 2026-11, source: "https://github.com/turbineBMW/omarchy-hardware-reports/issues/45" }
      keyboard: { state: works, version: "7.3-72", checked: 2026-11, source: "https://github.com/turbineBMW/omarchy-hardware-reports/issues/45" }
      touchpad: { state: works, version: "7.3-72", checked: 2026-11, source: "https://github.com/turbineBMW/omarchy-hardware-reports/issues/45" }
      wifi: { state: partial, note: "Works, but doesn't come back after deep sleep.", version: "7.3-72", checked: 2026-11, source: "https://github.com/turbineBMW/omarchy-hardware-reports/issues/45" }
      battery: { state: works, version: "7.3-72", checked: 2026-11, source: "https://github.com/turbineBMW/omarchy-hardware-reports/issues/45" }
      bluetooth: { state: broken, note: "Its QCC2072 card has no Bluetooth support in Linux yet.", checked: 2026-11, source: "https://github.com/turbineBMW/omarchy-hardware-reports/issues/45" }
      suspend: { state: broken, note: "Short sleeps work. Deep sleep cycled three times and the laptop restarted into Windows on the third; s2idle is being tested.", version: "7.3-72", checked: 2026-11, source: "https://github.com/turbineBMW/omarchy-hardware-reports/issues/45" }

