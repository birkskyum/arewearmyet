  microsoft-windows-dev-kit-2023:
    links:
      - title: Omarchy issue on the USB driver and boot option the Dev Kit needs
        url: https://github.com/omacom/omarchy/issues/18998
      - title: Omarchy issue on the Dev Kit's Wi-Fi board data
        url: https://github.com/omacom/omarchy/issues/18999
      - title: Omarchy issue on the black screen at the disk password prompt
        url: https://github.com/omacom/omarchy/issues/17327
      - title: Microsoft's Windows Dev Kit 2023 specifications
        url: https://learn.microsoft.com/en-us/windows/arm/dev-kit/
    checks:
      installer:
        state: partial
        note: The live installer ran, but there was no USB until the dwc3-qcom-legacy driver was loaded, and the monitor on mini DisplayPort went dark about 30 seconds into boot without the boot option regulator_ignore_unused.
        version: Omarchy edge 2026.11.14, kernel 7.3.0-60-omarchy
        checked: 2026-11
        source: https://github.com/omacom/omarchy/issues/18998
        basis: omarchy
        where: omarchy-dev 4.0.0.r7846, kernel 7.3.0-60-omarchy, later 7.3.0-63-omarchy
        quote: both failures were observed directly in the live installer with the same kernel (no USB without the legacy driver; display lost at ~30 s without the option, fixed by adding it)
      disk-unlock:
        state: partial
        note: With the stock setup the monitor goes black before the disk password prompt. The prompt stays visible with modprobe.blacklist=msm.
        version: Omarchy edge, kernel 7.3.0-63-omarchy
        checked: 2026-11
        source: https://github.com/omacom/omarchy/issues/17327#issuecomment-6896406345
        basis: omarchy
        where: omarchy-dev 4.0.0.r7846, kernels 7.3.0-60-omarchy and 7.3.0-63-omarchy
        quote: then the screen goes black at the initramfs udev trigger and the monitor reports no signal
      display:
        state: absent
        note: A desktop box without a screen of its own. Microsoft lists mini DisplayPort and two USB-C ports for monitors.
        checked: 2025-11
        source: https://learn.microsoft.com/en-us/windows/arm/dev-kit/
        basis: maker-spec
        where: Microsoft's Dev Kit 2023 page, last updated 2025-11-07
        quote: Until the device boots into Windows, all display output defaults to the monitor connected to the mDP port.
      gpu:
        state: partial
        note: The desktop runs on the Adreno 690 when the graphics driver is loaded after the disk is unlocked. Loaded early, it blanks the monitor.
        version: Omarchy edge, kernel 7.3.0-63-omarchy
        checked: 2026-11
        source: https://github.com/omacom/omarchy/issues/17327#issuecomment-6896406345
        basis: omarchy
        where: omarchy-dev 4.0.0.r7846, kernels 7.3.0-60-omarchy and 7.3.0-63-omarchy
        quote: and Hyprland starts on the GPU. The monitor blanks and resyncs a few times during the handover.
      backlight:
        state: absent
        note: There is no built-in screen.
        checked: 2025-11
        source: https://learn.microsoft.com/en-us/windows/arm/dev-kit/
        basis: maker-spec
        where: Microsoft's Dev Kit 2023 page, last updated 2025-11-07
        quote: Until the device boots into Windows, all display output defaults to the monitor connected to the mDP port.
      keyboard:
        state: absent
        note: There is no built-in keyboard. Microsoft advises a keyboard on the USB-A ports.
        checked: 2025-11
        source: https://learn.microsoft.com/en-us/windows/arm/dev-kit/
        basis: maker-spec
        where: Microsoft's Dev Kit 2023 page, last updated 2025-11-07
        quote: When connecting an external keyboard or mouse, use the USB-A ports, not USB-C.
      touchpad:
        state: absent
        note: There is no built-in touchpad.
        checked: 2025-11
        source: https://learn.microsoft.com/en-us/windows/arm/dev-kit/
        basis: maker-spec
        where: Microsoft's Dev Kit 2023 page, last updated 2025-11-07
        quote: When connecting an external keyboard or mouse, use the USB-A ports, not USB-C.
      touchscreen:
        state: absent
        note: There is no built-in screen.
        checked: 2025-11
        source: https://learn.microsoft.com/en-us/windows/arm/dev-kit/
        basis: maker-spec
        where: Microsoft's Dev Kit 2023 page, last updated 2025-11-07
        quote: Until the device boots into Windows, all display output defaults to the monitor connected to the mDP port.
      wifi:
        state: partial
        note: With the stock firmware files it finds only 2.4 GHz networks and links at about 16 Mbit/s. With board data borrowed from the ThinkPad X13s it reached 5 GHz at 160 MHz. After a warm restart from Windows it lost 35 to 57 percent of packets until a full power-off.
        version: Omarchy edge, kernel 7.3.0-63-omarchy
        checked: 2026-11
        source: https://github.com/omacom/omarchy/issues/18999
        basis: omarchy
        where: linux-firmware-atheros 20261019-1, kernels 7.3.0-60-omarchy and 7.3.0-63-omarchy
        quote: only 2.4 GHz networks are found; a 5 GHz network that a laptop beside it uses on 5220 MHz is not seen at all
