  acer-aspire-14-ai-a14-11m:
    details: The only test so far is one owner starting Omarchy's edge image from a USB stick in November 2026, without installing. The built-in speakers and microphones are not set up in Omarchy's device tree yet, so the installer's screen reader could only be heard through a USB audio adapter.
    links:
      - title: Owner's hardware report and boot test of the Aspire 14 AI
        url: https://github.com/turbineBMW/omarchy-hardware-reports/issues/1
      - title: Ubuntu request to support the Aspire 14 AI A14-11M
        url: https://bugs.launchpad.net/ubuntu-concept/+bug/2137358
    checks:
      installer:
        state: works
        note: An owner started the edge image from a USB stick and it picked the laptop's device tree by itself and reached the installer's start screen. A first try ended on a blank screen, the touchpad was not tried, and nobody has installed yet.
        version: edge image 2026.11.04
        checked: 2026-11
        source: https://github.com/turbineBMW/omarchy-hardware-reports/issues/1
      display:
        state: works
        note: The built-in screen showed Omarchy's installer in the owner's photo. The resolution was not checked.
