  hp-elitebook-ultra-g1q:
    details: HP builds it on the OmniBook X 14's mainboard, and its kernel device tree is that laptop's. The reports so far come from pre-release and community-built Omarchy images of August to October 2026, not from the current nightly image. Sound needs HP's own firmware and a sound topology that linux-firmware does not carry. The function row only sends F1 to F12.
    links:
      - title: Omarchy ISO pull request with an owner's test report (September 2026)
        url: https://github.com/omacom/omarchy-iso/pull/197
      - title: "Omarchy pull request: internal microphone routing"
        url: https://github.com/omacom/omarchy/pull/15574
      - title: "Ubuntu bug: Support HP EliteBook Ultra G1q 14"
        url: https://bugs.launchpad.net/ubuntu-concept/+bug/2093269
    checks:
      installer:
        state: works
        note: An owner installed pre-release Omarchy ARM images in August and September 2026, the second time encrypted and next to Windows. On the September image's boot menu the built-in keyboard's arrow keys did nothing.
        checked: 2026-09
        source: https://github.com/omacom/omarchy-iso/pull/197#issuecomment-5863642004
      disk-unlock:
        state: partial
