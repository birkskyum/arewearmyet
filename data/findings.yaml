  asus-vivobook-s16-s3607qa:
    details: The S3607QA is sold with an OLED or an LCD panel, and each has its own device tree. An owner of the OLED model installed Omarchy from the edge image in November 2026 and tested the keyboard, sound and sleep with the maintainers. A second device tree, written separately by another owner who runs mainline Linux 7.3 daily, is posted to the kernel list. The fan is run by the laptop's own controller, which Linux has no driver for.
    links:
      - title: "Owner's report and testing thread (omarchy-hardware-reports #2)"
        url: https://github.com/turbineBMW/omarchy-hardware-reports/issues/2
      - title: Device tree posted to the kernel list, with what its author tested
        url: https://lore.kernel.org/all/20261113214424.220241-1-ingo.kubbilun@gmail.com/
      - title: Ubuntu enablement request for the S3607QA
        url: https://bugs.launchpad.net/ubuntu-concept/+bug/2170935
    checks:
      installer:
        state: works
        note: An owner of the OLED model installed Omarchy from the edge image of 11 November 2026 without errors. Earlier sticks written to exFAT stopped at the logo.
        version: Omarchy edge 2026.11.11
        checked: 2026-11
        source: https://github.com/turbineBMW/omarchy-hardware-reports/issues/2
      disk-unlock:
        state: works
