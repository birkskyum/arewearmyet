        checked: 2026-11
        source: https://github.com/omacom/omarchy/issues/17396#issuecomment-6694011382
        basis: omarchy
        where: linux-omarchy 7.3-20 from a test build, over stable Omarchy
        quote: The microphones and webcam do not work on this laptop.
      cdsp:
        state: works
        note: The compute processor starts with the firmware from Windows.
        version: Omarchy 4.5 RC3, kernel 7.3
        checked: 2026-11
        source: https://github.com/omacom/omarchy/issues/17396
        basis: omarchy
        where: Omarchy 4.5.0rc3-1, kernel 7.3.0-3-omarchy
        quote: The CDSP also comes up with the newer files
