  asus-zenbook-a16-ux3607oa:
    details: The 16-inch model is wired very differently from the 14-inch Zenbook A14, so it has a device tree of its own, in Linux since 7.3. It only runs DSP firmware signed for this board and needs its own Wi-Fi board data, and Omarchy installs both as a package. Omarchy also gives it a speaker tuning based on ASUS's Windows voicing, asks for the disk password on a text console, and keeps suspend turned off until sleep is reliable.
    links:
      - title: "Omarchy: set up the Zenbook A16's firmware, disk unlock and sleep"
        url: https://github.com/omacom/omarchy/pull/17083
      - title: "Omarchy: turn off suspend on the Zenbook A16 until it sleeps reliably"
        url: https://github.com/omacom/omarchy/pull/18178
      - title: "Kernel list: Zenbook A16 support, with the list of working hardware"
        url: https://patchwork.kernel.org/project/linux-arm-msm/cover/20260721-topic-a16_submission-v1-0-8ea213130d05@oss.qualcomm.com/
      - title: Omarchy on Snapdragon X laptops (discussion)
        url: https://github.com/omacom/omarchy/discussions/11823
      - title: "Phoronix: Snapdragon X2 performance on Linux, measured on a Zenbook A16"
        url: https://www.phoronix.com/review/snapdragon-x2-linux
    checks:
      installer:
        state: partial
        note: Omarchy installs on this laptop. A USB stick in the USB-A port was not seen by the live installer until that port's driver was added to the image in November 2026, and nobody has confirmed the fix on the laptop in public yet.
        checked: 2026-11
        source: https://github.com/omacom/omarchy-iso/pull/376
      disk-unlock:
        state: partial
        note: The graphical unlock screen stays black on this laptop, so Omarchy asks for the disk password on a text console. The built-in keyboard types into it.
        version: linux-omarchy 7.3-7
        checked: 2026-10
        source: https://github.com/omacom/omarchy/pull/17083
      display:
        state: partial
        note: The 2880 x 1800 screen works. After the screen had been turned off, about 6 in 100 wakes left it dark on a 7.3 kernel without the fix, and that fix was still an open pull request in November 2026.
        version: "7.3"
        checked: 2026-11
        source: https://github.com/omacom/omarchy-pkgs/pull/2930
      gpu:
        state: works
        note: The author of its device tree lists the GPU as working on mainline Linux.
        version: "7.3"
        checked: 2026-08
        source: https://github.com/torvalds/linux/commit/e8fbbca94db752ab94d9dadf2f65872905eafecd
      backlight:
        state: works
        note: The brightness keys change the brightness. With Shift or Alt held they send F5 and F6 instead, so Omarchy's fine and full-range steps do not fire yet.
        version: linux-omarchy 7.3
        checked: 2026-11
        source: https://github.com/omacom/omarchy/pull/18038
      keyboard:
        state: works
        note: An owner confirmed the built-in keyboard on Omarchy's kernel, and Omarchy loads its driver early so it also types at the disk password prompt.
        version: linux-omarchy 7.2.8-24 with the A16 patches
        checked: 2026-10
        source: https://github.com/omacom/omarchy/pull/13820
      touchpad:
        state: works
        note: The touchpad works. A button has been seen to stay stuck down, and Update > Hardware > Trackpad now frees it.
        version: linux-omarchy 7.3
        checked: 2026-11
        source: https://github.com/omacom/omarchy/pull/17280
      touchscreen:
        state: works
        note: An owner with a touch model confirmed the touchscreen on Omarchy's kernel. The author of the device tree had no touch model to test.
        version: linux-omarchy 7.2.8-24 with the A16 patches
        checked: 2026-10
        source: https://github.com/omacom/omarchy/pull/13820
      wifi:
        state: works
        note: Wi-Fi connects once the laptop's own board data is installed, which Omarchy's firmware package for this model does. Without it the card finds no board data and stays off.
        version: linux-omarchy 7.3-7
        checked: 2026-10
        source: https://github.com/omacom/omarchy/pull/17083
      bluetooth:
        state: partial
        note: The author of the device tree lists Bluetooth as working on mainline, and an owner made calls and played audio over it on a patched 7.2.8 kernel. On Omarchy's 7.3 kernel it did not work yet at the end of October 2026.
        version: linux-omarchy 7.3-7
        checked: 2026-10
        source: https://github.com/omacom/omarchy-pkgs/pull/1875
      speakers:
        state: works
        note: All four speakers play, with a tuning taken from ASUS's own Windows voicing. By ear it is clearly better than the untuned speakers, though still short of Windows.
        version: linux-omarchy 7.3-5
        checked: 2026-10
        source: https://github.com/omacom/omarchy/pull/17039
      microphones:
        state: works
        note: Both built-in microphones record with Omarchy's audio package for this laptop.
        version: linux-omarchy 7.3-5
        checked: 2026-10
        source: https://github.com/omacom/omarchy-pkgs/pull/1841
      adsp:
        state: works
        note: The audio DSP starts with ASUS's firmware from Omarchy's firmware package. When Omarchy runs from a disk on a USB-C port it is held back, and then the battery readings and sound are missing.
        version: linux-omarchy 7.3-7
        checked: 2026-10
        source: https://github.com/omacom/omarchy/pull/17083
      battery:
        state: works
        note: The battery shows once the audio DSP has ASUS's firmware, which Omarchy's firmware package provides. Without that firmware there are no battery readings.
        version: linux-omarchy 7.3-7
        checked: 2026-10
        source: https://github.com/omacom/omarchy/pull/17083
      charging:
        state: works
        note: The author of the device tree lists charging as working on mainline, and an owner on Omarchy's kernel saw plugging and unplugging the charger noticed correctly.
        version: "7.3"
        checked: 2026-08
        source: https://github.com/torvalds/linux/commit/e8fbbca94db752ab94d9dadf2f65872905eafecd
      suspend:
        state: broken
        note: Neither sleep mode is reliable. Deep sleep resets the laptop on wake, and the lighter mode has hung until a forced power off, so Omarchy turns suspend off on this laptop.
        version: linux-omarchy 7.3
        checked: 2026-11
        source: https://github.com/omacom/omarchy/pull/18178
      suspend-drain:
        state: broken
        note: In the lighter sleep mode the chip never reaches its low-power state, because the audio and compute DSPs stay awake.
        version: linux-omarchy 7.3
        checked: 2026-11
        source: https://github.com/omacom/omarchy/pull/18178
      lid:
        state: works
        note: The lid switch is noticed. In a test on linux-omarchy 7.3-7, closing the lid put the laptop to sleep and opening it woke it, before suspend was turned off.
        version: linux-omarchy 7.3-7
        checked: 2026-10
        source: https://github.com/omacom/omarchy/pull/17083
      usb:
        state: works
        note: An owner measured the USB-A port at 10 Gbps and both USB-C ports at 5 Gbps. When Omarchy runs from a disk on a USB-C port, the USB-C ports only reach USB 3 speed with the plug one way up.
        version: linux-omarchy 7.3-55
        checked: 2026-11
        source: https://github.com/omacom/omarchy-pkgs/pull/2148
      external-display:
        state: partial
        note: The author of the device tree listed the HDMI port as working, but an owner later reported that it fails to start on mainline, and it did not work on Omarchy's 7.3 kernel at the end of October 2026.
        version: linux-omarchy 7.3-7
        checked: 2026-10
        source: https://github.com/omacom/omarchy-pkgs/pull/1875
      camera:
        state: partial
        note: The cameras do not work on Omarchy's kernel up to 7.3-70. Both the colour and the infrared camera stream with a kernel change that was still an open pull request in November 2026.
        version: linux-omarchy 7.3-71 test build
        checked: 2026-11
        source: https://github.com/omacom/omarchy-pkgs/pull/2931
      video-decode:
        state: partial
        note: The author of the device tree reports that the video engine works with patches that were not merged yet, and the device tree leaves it off until they are.
        version: "7.3"
        checked: 2026-07
        source: https://patchwork.kernel.org/project/linux-arm-msm/cover/20260721-topic-a16_submission-v1-0-8ea213130d05@oss.qualcomm.com/
      cdsp:
        state: works
        note: An owner saw both DSPs running with the laptop's own firmware.
        version: linux-omarchy 7.2.8-16 with the A16 patches
        checked: 2026-10
        source: https://github.com/omacom/omarchy/pull/13820
      modem:
        state: absent
        note: ASUS sells no version of this laptop with a mobile modem.
        checked: 2026-07
        source: https://patchwork.kernel.org/project/linux-arm-msm/cover/20260721-topic-a16_submission-v1-0-8ea213130d05@oss.qualcomm.com/

