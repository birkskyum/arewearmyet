        checked: 2026-11
        source: https://github.com/turbineBMW/omarchy-hardware-reports/issues/2
      display:
        state: works
        note: The OLED screen shows the desktop on Omarchy. The author of the posted device tree reports the LCD panel working on mainline Linux 7.3.3.
        version: linux-omarchy 7.3
        checked: 2026-11
        source: https://github.com/turbineBMW/omarchy-hardware-reports/issues/2
      gpu:
        state: works
        note: On mainline Linux 7.3.3 with the posted device tree, its author lists the Adreno X1-45 GPU as working.
        version: 7.3.3
        checked: 2026-11
        source: https://lore.kernel.org/all/20261113214424.220241-1-ingo.kubbilun@gmail.com/
      backlight:
        state: works
        note: On mainline Linux 7.3.3 with the posted device tree, its author lists the LCD panel's backlight as working.
        version: 7.3.3
        checked: 2026-11
        source: https://lore.kernel.org/all/20261113214424.220241-1-ingo.kubbilun@gmail.com/
      keyboard:
        state: works
        note: With linux-omarchy 7.3-69 all the Fn keys work and the keyboard backlight can be switched. Before that only the volume keys worked and the backlight stayed on.
        version: linux-omarchy 7.3-69
        checked: 2026-11
        source: https://github.com/turbineBMW/omarchy-hardware-reports/issues/2
      touchpad:
        state: works
        note: The owner found the touchpad working on first boot with this device tree, in an Ubuntu live session.
        checked: 2026-11
        source: https://github.com/turbineBMW/omarchy-hardware-reports/issues/2
      wifi:
        state: partial
        note: linux-firmware has no calibration data for this laptop's Wi-Fi card, so it did not start. With the generic data for the same card the owner connects at full speed, and Omarchy's packages now install that copy, which nobody has confirmed on this laptop yet.
        checked: 2026-11
        source: https://github.com/turbineBMW/omarchy-hardware-reports/issues/2
      bluetooth:
        state: works
        note: Bluetooth worked on first boot with this device tree, in an Ubuntu live session. The author of the posted device tree also lists it as working.
        checked: 2026-11
        source: https://github.com/turbineBMW/omarchy-hardware-reports/issues/2
      speakers:
        state: works
        note: Both speakers play with left and right the right way round. They are held quieter than on Windows to protect them.
        version: linux-omarchy-dtbs 7.3-41
        checked: 2026-11
        source: https://github.com/turbineBMW/omarchy-hardware-reports/issues/2
      microphones:
        state: works
        note: The built-in microphones were silent until a device tree fix, and record since linux-omarchy-dtbs 7.3-47. The owner needed full volume to hear the recording.
        version: linux-omarchy-dtbs 7.3-47
        checked: 2026-11
        source: https://github.com/turbineBMW/omarchy-hardware-reports/issues/2
      headphones:
        state: partial
        note: A headset plays and records, but after a boot the headphone output is missing until the audio service is restarted. The owner confirmed a fix to the sound profile that was not yet in the packages.
        version: linux-omarchy 7.3-71
        checked: 2026-11
        source: https://github.com/turbineBMW/omarchy-hardware-reports/issues/2
      adsp:
        state: works
        note: The audio DSP starts with ASUS's firmware on the installed system, and the battery readings and sound depend on it and work.
        checked: 2026-11
        source: https://github.com/turbineBMW/omarchy-hardware-reports/issues/2
      battery:
        state: works
