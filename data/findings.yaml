        basis: omarchy
        where: Test build of linux-omarchy 7.3-71 on a UX3607OA, 2026-11
        quote: CAMSS registers CSID0/1, IFE0/1 and the three TPGs, and libcamera streams both cameras.
      video-decode:
        state: partial
        note: The author of the device tree reports that the video engine works with patches that were not merged yet, and the device tree leaves it off until they are.
        version: "7.3"
        checked: 2026-07
        source: https://patchwork.kernel.org/project/linux-arm-msm/cover/20260721-topic-a16_submission-v1-0-8ea213130d05@oss.qualcomm.com/
        basis: tree-author
        where: Kernel list posting by the tree's author, 2026-07
        quote: The video accelerator (Iris) also works with the in-flight patches
      cdsp:
        state: works
        note: An owner saw both DSPs running with the laptop's own firmware.
        version: linux-omarchy 7.2.8-16 with the A16 patches
        checked: 2026-10
        source: https://github.com/omacom/omarchy/pull/13820
        basis: omarchy
        where: Owner's build of linux-omarchy 7.2.8-16 with the A16 patches, 2026-10
        quote: Wi-Fi is connected, and both DSPs run.
      modem:
        state: absent
        note: ASUS sells no version of this laptop with a mobile modem.
        checked: 2026-07
        source: https://patchwork.kernel.org/project/linux-arm-msm/cover/20260721-topic-a16_submission-v1-0-8ea213130d05@oss.qualcomm.com/
        basis: tree-author
        where: Kernel list posting by the tree's author, 2026-07
        quote: ASUS doesn't currently offer a SKU with a PCIe modem, but enabling
