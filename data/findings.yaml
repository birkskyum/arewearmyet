  hp-omnibook-x-14-kr:
    details: |
      The 14-kr1 with the 6-core X2 Plus (Kalambo) chip. Its tree ships with the GPU off, so the desktop needs LIBGL_ALWAYS_SOFTWARE=1 in /etc/environment. The kernel picks deep sleep by default, which loses the Wi-Fi card on resume and restarts the laptop after a few cycles; s2idle is being tested.
    links:
      - title: Owner's hardware report and test thread
        url: https://github.com/turbineBMW/omarchy-hardware-reports/issues/45
    checks:
      gpu: { state: broken, note: "The GPU isn't supported by Omarchy's kernel yet. The desktop only comes up on software rendering, after adding LIBGL_ALWAYS_SOFTWARE=1 to /etc/environment.", version: "7.3-72", checked: 2026-11, source: "https://github.com/turbineBMW/omarchy-hardware-reports/issues/45", basis: omarchy, where: "Omarchy edge image 2026.11.16.492, kernel 7.3.0-72-omarchy, 2026-11-17", quote: Adding `LIBGL_ALWAYS_SOFTWARE=1` to `/etc/environment` allowed me to enter my password and now the desktop comes up! }
      keyboard: { state: works, version: "7.3-72", checked: 2026-11, source: "https://github.com/turbineBMW/omarchy-hardware-reports/issues/45", note: "", basis: omarchy, where: "Omarchy edge image 2026.11.16.492, kernel 7.3.0-72-omarchy, 2026-11-17", quote: "* Keyboard and touchpad work", under: 'Syntax: simple "KEY=VAL" pairs on separate lines' }
      touchpad: { state: works, version: "7.3-72", checked: 2026-11, source: "https://github.com/turbineBMW/omarchy-hardware-reports/issues/45", note: "", basis: omarchy, where: "Omarchy edge image 2026.11.16.492, kernel 7.3.0-72-omarchy, 2026-11-17", quote: "* Keyboard and touchpad work", under: 'Syntax: simple "KEY=VAL" pairs on separate lines' }
      wifi: { state: partial, note: "Works, but is gone after a sleep of a few minutes in either sleep mode, and restarting Wi-Fi doesn't bring it back. A longer sleep ends in a restart, after which Wi-Fi works again.", version: "7.3-72", checked: 2026-11, source: "https://github.com/turbineBMW/omarchy-hardware-reports/issues/45", basis: omarchy, where: "Omarchy edge image 2026.11.16.492, kernel 7.3.0-72-omarchy, 2026-11-18", quote: "After authenticating, WiFi was not working as I think you mentioned. Attempting to restart by running `omarchy-restart-wifi` had no effect." }
      battery: { state: works, version: "7.3-72", checked: 2026-11, source: "https://github.com/turbineBMW/omarchy-hardware-reports/issues/45", note: "The battery applet appears to work, with three power profiles shown. The owner gives no readings.", basis: omarchy, where: "Omarchy edge image 2026.11.16.492, kernel 7.3.0-72-omarchy, 2026-11-17", quote: "* Battery applet appears to work with three profiles displayed" }
      bluetooth: { state: broken, note: "Its QCC2072 card has no Bluetooth support in Linux yet.", checked: 2026-11, source: "https://github.com/turbineBMW/omarchy-hardware-reports/issues/45", basis: omarchy, where: "Omarchy edge image 2026.11.16.492, kernel 7.3.0-72-omarchy, 2026-11-17", quote: Bluetooth has to wait for the kernel. Linux drives the QCC2072's Wi-Fi but has no support for its Bluetooth yet. }
      suspend: { state: broken, note: "A sleep of a few minutes wakes. A sleep of about half an hour ends in a restart, in both sleep modes (deep and s2idle), as its owner found on 18 November 2026.", version: "7.3-72", checked: 2026-11, source: "https://github.com/turbineBMW/omarchy-hardware-reports/issues/45", basis: omarchy, where: "Omarchy edge image 2026.11.16.492, kernel 7.3.0-72-omarchy, 2026-11-18", quote: "After about 30 minutes with the lid closed, the screen was blank. Tapping any keys seemed to have no effect to wake up the machine. But after two minutes, the boot-time password greeter was displayed." }

