        checked: 2026-11
        source: https://github.com/omacom/omarchy/issues/18585
        basis: omarchy
        where: Omarchy edge, linux-omarchy 7.3-49; the jack report is from Ubuntu 26.04 on a 14-fe1
        quote: are missing, so a monitor on a USB-C port and plugged-in headphones don't show up as outputs.
