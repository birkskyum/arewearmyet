        source: https://bugs.launchpad.net/ubuntu-concept/+bug/2084540
      backlight:
        state: works
        note: The screen backlight works on Omarchy's desktop, with a working range of 0 to 1023. The brightness keys are not mentioned.
        version: Omarchy 4.5.0, linux-omarchy 7.3-3.1
        checked: 2026-11
        source: https://github.com/omacom/omarchy/issues/17327
      touchpad:
        state: works
        note: The device tree's author lists the touchpad as working.
        version: "6.13"
        checked: 2024-10
        source: https://github.com/torvalds/linux/commit/f5b788d0e8cd
      touchscreen:
        state: works
        note: The device tree's author lists the touchscreen as working.
        version: "6.13"
        checked: 2024-10
        source: https://github.com/torvalds/linux/commit/f5b788d0e8cd
      wifi:
