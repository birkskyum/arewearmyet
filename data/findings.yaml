        note: Wi-Fi works on Ubuntu. A freeze when the access point dropped the connection was fixed with kernel 6.17.
        version: Ubuntu, kernel 6.17
        checked: 2025-09
        source: https://bugs.launchpad.net/ubuntu-concept/+bug/2084540
      bluetooth:
