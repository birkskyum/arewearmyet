        state: absent
        note: Microsoft states the device has no battery and runs only on its power supply.
        checked: 2025-11
        source: https://learn.microsoft.com/en-us/windows/arm/dev-kit/
        basis: maker-spec
        where: Microsoft's Dev Kit 2023 page, last updated 2025-11-07
        quote: The device has no battery, so the system runs only on AC.
