  dell-xps-13-9345:
    details: The XPS 13 9345 has been in mainline Linux since 6.13, and Dell has put most of its firmware into linux-firmware, though not the video firmware. Sound was the long-standing gap. Omarchy's device tree gained the four speakers and two microphones in November 2026 after an owner tested them, while Ubuntu owners still report no sound. The webcam is not in Omarchy's device tree yet. External screens work but are fragile.
    links:
