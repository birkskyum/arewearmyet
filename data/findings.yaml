  asus-zenbook-a16-ux3607oa:
    links:
      - title: "Omarchy: set up the Zenbook A16's firmware, disk unlock and sleep"
        url: https://github.com/omacom/omarchy/pull/17083
      - title: "Omarchy: turn off suspend on the Zenbook A16 until it sleeps reliably"
        url: https://github.com/omacom/omarchy/pull/18178
      - title: "Kernel list: Zenbook A16 support, with the list of working hardware"
        url: https://patchwork.kernel.org/project/linux-arm-msm/cover/20260721-topic-a16_submission-v1-0-8ea213130d05@oss.qualcomm.com/
    checks:
      installer:
        state: partial
        note: A USB stick in the USB-A port never mounted in the live installer, because that port's driver was missing from the live image. The driver was added in November 2026, and the pull request reports no test of it on the laptop.
        checked: 2026-11
        source: https://github.com/omacom/omarchy-iso/pull/376
        basis: omarchy
        where: Omarchy live installer, before the driver was added in 2026-11
        quote: A USB stick in the ASUS Zenbook A16's USB-A port never mounts in the live installer.
      disk-unlock:
        state: partial
        note: The graphical unlock screen stays black on this laptop, so Omarchy asks for the disk password on a text console. The built-in keyboard types into it.
        version: linux-omarchy 7.3-7
        checked: 2026-10
        source: https://github.com/omacom/omarchy/pull/17083
        basis: omarchy
        where: Omarchy, linux-omarchy 7.3-7, 2026-10
        quote: since Plymouth leaves the panel black, and puts the keyboard, the embedded controller, the USB-C chain, the USB-A port's PTN3222 repeater and the Adreno X2's microcode in the initramfs so they work before unlock.
      display:
        state: partial
        note: After the screen has been turned off, the panel sometimes stays dark on wake. In 100 off and on cycles a 7.3 kernel without the fix had 6 dark wakes, and Omarchy's 7.3-64 kernel with the fix had none. The fix was still an open pull request in mid November 2026.
        version: "7.3"
        checked: 2026-11
        source: https://github.com/omacom/omarchy-pkgs/pull/2930
        basis: other-distro
        where: Fedora's A16 7.3 kernel without the fix and Omarchy 7.3-64 with it, 100 screen off and on cycles each, 2026-11
        quote: "Fedora's A16 7.3 kernel without the patch: 6 black wakes, 5 with the link at 2 lanes and 1 at 1 lane."
      gpu:
        state: works
        note: The author of its device tree lists the GPU as working on mainline Linux.
        version: "7.3"
        checked: 2026-08
        source: https://github.com/torvalds/linux/commit/e8fbbca94db752ab94d9dadf2f65872905eafecd
        basis: tree-author
        where: Mainline device tree commit by the tree's author, 2026-07
        quote: "- GPU, Display"
        under: "Currently working:"
      backlight:
        state: works
        note: The brightness keys change the brightness. With Shift or Alt held they send F5 and F6 instead, so Omarchy's fine and full-range steps do not fire yet.
        version: linux-omarchy 7.3
        checked: 2026-11
        source: https://github.com/omacom/omarchy/pull/18038
        basis: omarchy
        where: Omarchy on a UX3607OA, 2026-11
        quote: On the ASUS Zenbook A16 UX3607OA, the keyboard firmware turns the brightness keys back into F-keys while a modifier is held.
      keyboard:
        state: works
        note: An owner confirmed the built-in keyboard on a test build of Omarchy's 7.2.8 kernel with the laptop's patches.
        version: linux-omarchy 7.2.8-24 with the A16 patches
        checked: 2026-10
        source: https://github.com/omacom/omarchy/pull/13820
        basis: omarchy
        where: Owner's build of linux-omarchy 7.2.8-24 with the A16 patches, 2026-10
        quote: I confirmed audio playback, keyboard, touchscreen, charger transitions, and Bluetooth calls and audio with my phone.
      touchpad:
        state: partial
        note: A touchpad button has been seen to stay stuck down on this laptop, and Update > Hardware > Trackpad now releases it.
        version: linux-omarchy 7.3
        checked: 2026-11
        source: https://github.com/omacom/omarchy/pull/17280
        basis: omarchy
        where: Omarchy on a Zenbook A16, 2026-11
        quote: "Tested: the cycle reset is what freed a stuck trackpad on the Zenbook A16."
      touchscreen:
        state: works
        note: An owner with a touch model confirmed the touchscreen on a test build of Omarchy's 7.2.8 kernel with the laptop's patches.
        version: linux-omarchy 7.2.8-24 with the A16 patches
        checked: 2026-10
        source: https://github.com/omacom/omarchy/pull/13820
        basis: omarchy
        where: Owner's build of linux-omarchy 7.2.8-24 with the A16 patches, 2026-10
        quote: I confirmed audio playback, keyboard, touchscreen, charger transitions, and Bluetooth calls and audio with my phone.
      bluetooth:
        state: broken
        note: Bluetooth did not work on Omarchy's 7.3 kernel when the laptop's device tree was added at the end of October 2026.
        version: linux-omarchy 7.3-7
        checked: 2026-10
        source: https://github.com/omacom/omarchy-pkgs/pull/1875
        basis: omarchy
        where: linux-omarchy 7.3-7, 2026-10
        quote: HDMI output, Bluetooth, suspend and the camera still don't work on the A16.
      speakers:
        state: works
        note: All four speakers play, with a tuning taken from ASUS's own Windows voicing. By ear it is clearly better than the untuned speakers, though still short of Windows.
        version: linux-omarchy 7.3-5
        checked: 2026-10
        source: https://github.com/omacom/omarchy/pull/17039
        basis: omarchy
        where: Omarchy on a UX3607OA (BIOS UX3607OA.312), 2026-10
        quote: By ear on this laptop it's clearly better than the raw speakers. It still falls short of Windows
      microphones:
        state: works
        note: Both built-in microphones record with Omarchy's audio package for this laptop.
        version: linux-omarchy 7.3-5
        checked: 2026-10
        source: https://github.com/omacom/omarchy-pkgs/pull/1841
        basis: omarchy
        where: linux-omarchy 7.3-5 on a UX3607OA, 2026-10
        quote: This package makes all four speakers and both microphones work.
      adsp:
        state: works
        note: The audio DSP needs ASUS's own firmware, which Omarchy installs from a firmware package. On an install that runs from a USB disk Omarchy holds the DSP driver back, so battery readings and sound are missing there. An owner's experiment that started it early on such an install brought both back on one boot.
        version: linux-omarchy 7.3-7
        checked: 2026-10
        source: https://github.com/omacom/omarchy/pull/17083
        basis: omarchy
        where: Omarchy USB install on a UX3607OA, one boot in an owner's experiment, 2026-10
        quote: an early-DSP experiment restored battery reporting and speakers on one physical USB-A-root boot
      battery:
        state: works
        note: Without the laptop's own DSP firmware there are no battery readings, so Omarchy installs it from a firmware package. On an install that runs from a USB disk the DSP is held back, and an owner's experiment that started it there brought battery reporting back on one boot.
        version: linux-omarchy 7.3-7
        checked: 2026-10
        source: https://github.com/omacom/omarchy/pull/17083
        basis: omarchy
        where: Omarchy USB install on a UX3607OA, one boot in an owner's experiment, 2026-10
        quote: an early-DSP experiment restored battery reporting and speakers on one physical USB-A-root boot
      charging:
        state: works
        note: The author of the device tree lists charging as working.
        version: "7.3"
        checked: 2026-08
        source: https://github.com/torvalds/linux/commit/e8fbbca94db752ab94d9dadf2f65872905eafecd
        basis: tree-author
        where: Mainline device tree commit by the tree's author, 2026-07
        quote: "- Charging, Type-C, Type-A port"
        under: "Currently working:"
      suspend:
        state: broken
        note: Neither sleep mode is reliable. Deep sleep resets the laptop on wake, and the lighter mode has hung until a forced power off, so Omarchy turns suspend off on this laptop.
        version: linux-omarchy 7.3
        checked: 2026-11
        source: https://github.com/omacom/omarchy/pull/18178
        basis: omarchy
        where: Omarchy on a UX3607OA, 2026-11
        quote: Neither sleep mode works reliably on the Zenbook A16 (UX3607OA) yet
      suspend-drain:
        state: broken
        note: In the lighter sleep mode the chip never reaches its low-power state, because the audio and compute DSPs stay awake.
        version: linux-omarchy 7.3
        checked: 2026-11
        source: https://github.com/omacom/omarchy/pull/18178
        basis: omarchy
        where: Omarchy on a UX3607OA, 2026-11
        quote: The audio and compute DSPs, though, never enter sleep after their firmware boots (adsp/cdsp sleep counts don't move across a 34-minute s2idle), which keeps CX up.
      lid:
        state: works
        note: In a test on linux-omarchy 7.3-7, closing the lid put the laptop into light sleep, and it resumed with the session intact.
        version: linux-omarchy 7.3-7
        checked: 2026-10
        source: https://github.com/omacom/omarchy/pull/17083
        basis: omarchy
        where: linux-omarchy 7.3-7 on a UX3607OA, 2026-10
        quote: "Tested on a UX3607OA with linux-omarchy 7.3-7: lid close entered s2idle and resumed with the session intact."
      usb:
        state: works
        note: An owner measured the USB-A port at 10 Gbps and both USB-C ports at 5 Gbps. On an install that runs from a USB disk, where Omarchy keeps the DSPs off by default, each USB-C port only linked at USB 3 speed with the plug one way up.
        version: linux-omarchy 7.3-55
        checked: 2026-11
        source: https://github.com/omacom/omarchy-pkgs/pull/2148
        basis: omarchy
        where: linux-omarchy 7.3-55 on a UX3607OA, 2026-11
        quote: My SSD is a USB install, where Omarchy keeps them off by default, and without them each USB-C port only linked at USB3 with the plug one way up.
      external-display:
        state: broken
        note: The HDMI port did not work on Omarchy's 7.3 kernel when the laptop's device tree was added at the end of October 2026. A screen on USB-C is not mentioned.
        version: linux-omarchy 7.3-7
        checked: 2026-10
        source: https://github.com/omacom/omarchy-pkgs/pull/1875
        basis: omarchy
        where: linux-omarchy 7.3-7, 2026-10
        quote: HDMI output, Bluetooth, suspend and the camera still don't work on the A16.
      camera:
        state: partial
        note: Both the colour and the infrared camera stream on a test build of Omarchy's kernel (7.3-71) with camera patches that were still an open pull request in mid November 2026. Released kernels do not have them.
        version: linux-omarchy 7.3-71 test build
        checked: 2026-11
