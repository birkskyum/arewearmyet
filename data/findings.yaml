        source: https://wiki.postmarketos.org/wiki/Lenovo_ThinkPad_X13s_(lenovo-21bx)
        basis: other-distro
        where: postmarketOS, per its wiki, where the camera is listed as Partial
        quote: The Spectra DSP is not supported so the RAW images have to be processed on the CPU using soft IPA, which gives the image a yellowish tint.
