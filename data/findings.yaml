        checked: 2026-04
        source: https://bugs.launchpad.net/ubuntu-concept/+bug/2084540
      speakers:
        state: works
        note: On Omarchy all four speakers play on the correct sides with no errors, tested with speech at 70% volume. On Ubuntu owners still report no sound from the speakers.
        version: linux-omarchy 7.3-61, linux-omarchy-dtbs 7.3-17
        checked: 2026-11
        source: https://github.com/omacom/omarchy-pkgs/issues/2293
      microphones:
        state: works
        note: On Omarchy both built-in microphones recorded clear speech.
        version: linux-omarchy 7.3-61, linux-omarchy-dtbs 7.3-17
        checked: 2026-11
        source: https://github.com/omacom/omarchy-pkgs/issues/2293
      adsp:
        state: works
