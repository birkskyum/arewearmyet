# What "supported" means past booting, as one list of checks for every Snapdragon PC.
#
#   id        stable key, used by hw-test, the API and data/findings.yaml
#   group     the heading it sits under on a model page
#   title     what's checked, as a short label
#   works     what has to be true for it to count as working
#   probe     what hw-test measures for it by itself, when it can measure anything. That
#             alone never marks a check as working where a person has to see or hear it
#   person    what the owner does to check it, for the parts no command can see
#   optional  true when not every model has the hardware (touchscreen, modem, ...)
#   desk      the title, works and person texts as they read on a desktop, mini PC or developer
#             kit, which has no lid to close and whose only screen is one that is plugged in
#
# The states a check can have on a model are works, partial, broken, untested and absent
# (the model doesn't have that hardware).

groups:
  - id: start
    title: Starting and installing
  - id: display
    title: Screen and input
  - id: network
    title: Wireless
  - id: sound
    title: Sound
  - id: power
    title: Battery, sleep and power
  - id: ports
    title: Ports and external screens
  - id: media
    title: Camera, video and AI
  - id: sensors
    title: Sensors and other hardware

checks:
  - id: installer
    group: start
    title: USB stick and installer
    works: The install image starts from a USB stick by itself and reaches the installer, with keyboard and touchpad working.
    person: Boot the current install image from a USB stick with Secure Boot off, and say whether the installer appeared and whether the keyboard and touchpad worked in it.
    debug: "The installer image picks the device tree by the machine's hardware IDs. A black screen right after the boot menu usually means no tree matched. Compare `systemd-analyze chid` with the IDs on the model's page. A keyboard or touchpad that is dead only in the installer means the tree lacks it or its driver isn't in the image. Fixed in `linux-omarchy-dtbs` (tree and hardware IDs)."

  - id: disk-unlock
    group: start
    title: Disk password prompt
    works: The disk password prompt shows on the built-in screen at startup and the built-in keyboard types into it.
    probe: On a laptop with an encrypted disk, when the built-in screen and keyboard came up at this boot against when the disk opened, from the kernel's log.
    person: Restart and say whether the password prompt was visible and whether the built-in keyboard worked in it.
    debug: "The prompt runs from the initramfs, before most drivers load. A prompt that can't be typed into means part of the keyboard's driver chain isn't in the initramfs (i2c-hid-of, the I2C controller, pin control, regulators, or the USB controller for a USB keyboard). No visible prompt means the display's chain isn't. Compare `lsinitcpio` on the image with `lsmod` on the running system."

  - id: display
    group: display
    title: Built-in screen
    works: The built-in screen shows the desktop at its native resolution.
    probe: The built-in panel's connector, its state and its preferred mode.
    person: Say whether the desktop fills the screen sharply, and whether anything flickers.
    debug: "The built-in panel hangs off the eDP controller (`mdss_dp3` on Snapdragon X), with the panel under its `aux-bus`. Read `journalctl -k -b | grep -iE 'msm|dpu|edp|panel'` and `cat /sys/class/drm/card*-eDP-1/{status,modes}`. A panel the kernel doesn't know gets cautious timings from `panel-edp` and a warning that names its EDID id. A wrong resolution or a black screen after the boot logo points at the tree's panel node, its supply or its enable GPIO."

  - id: gpu
    group: display
    title: Graphics acceleration
    works: The desktop runs on the GPU, not on software rendering.
    probe: On a Snapdragon, whether a render node from the msm driver exists and the GPU's firmware loaded. On an NVIDIA machine, whether a driver is bound to its GPU. The graphics test asks Vulkan which device programs draw on.
    debug: "The GPU needs the msm kernel driver, Mesa, and three firmware files, which are the SQE and GMU firmware from linux-firmware and a zap shader signed by the computer's maker, named by `firmware-name` under the tree's `gpu` node. `journalctl -k -b | grep -iE 'adreno|a7xx|a8xx|gmu|zap'` shows which is missing. Without the zap shader the desktop runs on software rendering, and `vulkaninfo --summary` shows llvmpipe."

  - id: webgl
    group: display
    title: WebGL in the browser
    works: The default browser gives pages WebGL on the GPU, not on a renderer that runs on the processor.
    probe: The graphics test opens a page in the default browser without a window and reads the renderer its WebGL context reports. The result names the browser. Chromium stands in when the default is not Chrome, Chromium or one built on it.
    debug: "Each browser on Omarchy starts with switches of its own, Chrome with `~/.config/chrome-flags.conf` and Chromium with `~/.config/chromium-flags.conf`. The result names the browser that was tested, so change that one's file. Its `chrome://gpu` page says what it uses and why a feature is off. WebGL on SwiftShader means the browser found no usable GPU, so fix the `gpu` check first."

  - id: webgpu
    group: display
    title: WebGPU in the browser
    works: The default browser gives pages WebGPU on the GPU without being started in a special way.
    probe: The graphics test asks the default browser for a WebGPU adapter and device, as it comes and again with the switches that turn WebGPU on. Working only with the switches counts as partly. The result names the browser.
    debug: "Chrome and Chromium on Linux don't turn WebGPU on by themselves on most ARM GPUs. Vulkan has to work first, which `vulkaninfo --summary` shows by naming the GPU and not llvmpipe. The result names the browser that was tested, and each reads its own file, Chrome `~/.config/chrome-flags.conf` and Chromium `~/.config/chromium-flags.conf`. The test's first run starts the browser with that file, so switches set there count as working. A switch set for one browser does nothing for the other. To try it for Chromium on this machine, keep a copy of its file, then `omarchy-chromium-add-feature Vulkan` and `omarchy-chromium-add-feature WebGPU` (they add to the `--enable-features` line that is there, where a second such line would replace it), and put `--enable-unsafe-webgpu` on a line of its own. A fix for everyone is a per-user setting in omacom/omarchy (the guide's table says where). Whether Omarchy wants that switch on by default is the team's call, so say in the pull request that it is a proposal."

  - id: backlight
    group: display
    title: Screen brightness
    works: The brightness keys change the screen's brightness over its whole range.
    probe: Whether a backlight device exists, and its range.
    person: Press the brightness keys and say whether the screen gets darker and brighter.
    debug: "`ls /sys/class/backlight` should list one device. OLED panels and some LCDs are dimmed over the eDP link, where `panel-edp` registers the backlight. Others take a PWM from the PMIC (`pwm-backlight` with an enable GPIO). Brightness that reads back but changes nothing usually means the wrong PWM channel or a missing enable GPIO in the tree."

  - id: keyboard
    group: display
    title: Built-in keyboard
    works: Every key types, including the function row.
    probe: Whether a built-in keyboard device exists.
    person: Type on it and try the function row (volume, brightness, mute).
    debug: "Most of these keyboards are HID over I2C, which the tree describes as a node under one of the tree's I2C buses with `compatible = \"hid-over-i2c\"`, the descriptor address, an interrupt GPIO and its supply. `cat /sys/bus/i2c/devices/*/name` and `journalctl -k -b | grep -i i2c_hid` show whether it was found. Bus, address and interrupt come from the device's `_CRS` in the ACPI DSDT. Some models put the keyboard on an internal USB port or behind the embedded controller instead."

  - id: touchpad
    group: display
    title: Touchpad
    works: Pointer, tap or click, two-finger scrolling and gestures work.
    probe: Whether a built-in touchpad device exists.
    person: Move, click, scroll with two fingers and try a three-finger swipe.
    debug: "Like the keyboard it is usually HID over I2C, described in the tree with bus, address, interrupt GPIO and supply taken from the DSDT. A touchpad that is found but doesn't move the pointer often has the wrong interrupt pin or polarity. Its line in `/proc/interrupts` should count up while a finger moves."

  - id: touchscreen
    group: display
    title: Touchscreen and pen
    works: Touch input lands where the finger is, and a pen draws if the model has one.
    probe: Whether a touchscreen device exists.
    person: Tap and drag on the screen, and try the pen if it came with one.
    optional: true
    debug: "HID over I2C again, often with a reset GPIO and a power-on delay (`post-power-on-delay-ms`). `hyprctl devices` shows whether the desktop sees it. `hw-test facts` prints the interrupt it found for it. Touches that land in the wrong place are a rotation matter in the desktop, not the driver."

  - id: wifi
    group: network
    title: Wi-Fi
    works: Wi-Fi connects and stays connected at full speed, also after sleep.
    probe: The Wi-Fi interface, its driver and whether it's connected. The wireless test reads the link's signal and speed.
    person: Say whether it stays connected through a day of use and after waking from sleep.
    debug: "The card is a WCN7850 (ath12k) or WCN6855 (ath11k) on PCIe. `journalctl -k -b | grep -iE 'ath1[12]k|pci'` tells how far it gets. No PCI device means the tree's PCIe port, its PHY or the card's power sequencer is wrong. 'failed to fetch board data' means linux-firmware's `board-2.bin` has no entry for this machine, and the line names the board ID that is missing. `rfkill list` rules out a soft block."

  - id: wifi-address
    group: network
    title: Fixed Wi-Fi address
    works: The Wi-Fi card keeps the same address on every boot, so networks and routers recognise the laptop.
    probe: Whether the kernel calls the interface's address permanent or randomly made.
    debug: "`cat /sys/class/net/wlan0/addr_assign_type` reads 1 for a made-up address. See whether the address changes over restarts. NetworkManager and iwd can also randomise the address by setting, which isn't a hardware fault. Never report the address itself."

  - id: bluetooth
    group: network
    title: Bluetooth
    works: Bluetooth turns on, finds devices and keeps headphones and mice connected.
    probe: Whether a Bluetooth controller exists and is powered. The wireless test listens for eight seconds and counts the devices it hears.
    person: Pair a pair of headphones or a mouse and use it for a few minutes.
    debug: "The Bluetooth half of the Wi-Fi chip sits on a UART, which the tree describes as a `bluetooth` node under one of its serial ports with its supplies. `journalctl -k -b | grep -iE 'bluetooth|hci|qca'` shows its firmware loading from `qca/`, and some machines need an NVM file of their own. A controller without an address shows as unconfigured in `btmgmt info`. `rfkill list` rules out a soft block."

  - id: speakers
    group: sound
    title: Speakers
    works: Every built-in speaker plays, at a normal volume, without crackling.
    probe: Whether a sound card with a playback device exists, besides HDMI and USB ones.
    person: Play music and say whether both sides (and the tweeters, if it has them) play cleanly.
    debug: "Sound runs through the audio DSP. Four things have to hold, in this order. The ADSP must be running (see the `adsp` check), the sound card must exist (`cat /proc/asound/cards`), the topology file the card asks for must be under `/lib/firmware/qcom/` (the journal names it when it's missing), and alsa-ucm-conf needs a profile for the card (`alsaucm listcards`, `wpctl status`). The speaker amplifiers (WSA883x or WSA884x on SoundWire) need their reset GPIOs and supplies in the tree. One silent side is usually one amplifier's GPIO or the channel mapping. `hw-test speakers` measures each side with the microphones. `ls /sys/bus/soundwire/devices/` shows whether every amplifier is there. `dtc -I fs -O dts /proc/device-tree 2>/dev/null | grep -A9 'speaker@'` shows each one's reset GPIO in the running tree, and `tr '\\0' '\\n' < /proc/device-tree/sound/audio-routing | paste - -` the output each speaker is fed from. On a side with a woofer and a tweeter, the two should come from different outputs (`WSA_SPK1` and `WSA_SPK2`). A quiet or silent side with every amplifier present is usually this routing, not a GPIO. Never raise amplifier or speaker gains above what the sound profile sets. The kernel has no speaker protection on these computers, and a speaker can be damaged."

  - id: microphones
    group: sound
    title: Built-in microphones
    works: The built-in microphones record clearly.
    probe: Whether a capture device exists on the built-in sound card.
    person: Record a few seconds and play it back.
    debug: "The built-in microphones are digital and need their supply and pins in the tree and a UCM profile that routes them. `wpctl status` should list an internal microphone source. Silence from a source that exists is usually the microphone supply or the wrong microphone pair in the profile. `hw-test speakers` records known tones and reports the level per pitch."

  - id: headphones
    group: sound
    title: Headphone jack
    works: Headphones play when plugged in, and the speakers go quiet.
    person: Plug in wired headphones and play something.
    optional: true
    debug: "The jack runs through a WCD938x or WCD939x codec on SoundWire, which also detects the plug. The UCM profile switches the output when a plug is seen, and `wpctl status` then shows the headphones port as available. No switch means jack detection (the codec's interrupt or its settings in the tree). Sound that doesn't come after a switch means the codec's supplies or the profile's routing."

  - id: adsp
    group: sound
    title: Audio and battery processor
    works: The audio DSP starts, which sound, the battery readings and USB-C power need.
    probe: The state of the adsp remote processor and the firmware it loaded.
    debug: "`cat /sys/class/remoteproc/remoteproc*/{name,state,firmware}` shows whether it runs and which file it wants. The file is signed by the computer's maker and comes from the computer's own Windows partition or from its firmware package in omarchy-pkgs. Battery readings, charging, USB-C and sound all depend on this processor."

  - id: battery
    group: power
    title: Battery readings
    works: The battery's charge, state and time left show correctly.
    probe: Whether a battery reports its charge and state.
    debug: "Battery readings come from the ADSP (`qcom_battmgr` over pmic_glink). No battery under `/sys/class/power_supply` means the ADSP isn't running (see the `adsp` check) or the tree lacks the `pmic-glink` node."

  - id: charging
    group: power
    title: USB-C charging
    works: The laptop charges at full power from its own charger, not only at 5 V.
    probe: The voltage and online state the USB-C power supply reports.
    person: Plug in the laptop's own charger and say whether the charge rises at the usual speed.
    debug: "USB-C charging is negotiated by the ADSP's firmware and reported through UCSI. Read `cat /sys/class/power_supply/*/{status,online}` and `journalctl -k -b | grep -iE 'ucsi|pmic_glink|battmgr'`. Charging that works with the computer off and not under Linux points at the ADSP not running."

  - id: suspend
    group: power
    title: Sleep and wake
    works: Closing the lid sleeps, opening it wakes to the lock screen, every time.
    probe: The sleep mode the kernel uses and how many sleeps succeeded or failed since boot.
    person: Close the lid for a few minutes, five times in a row, and say whether it woke each time.
    desk:
      works: The computer sleeps when asked to, and wakes to the lock screen with a key or the power button, every time.
      person: Put it to sleep for a few minutes, five times in a row, and say whether it woke each time.
    debug: "`cat /sys/power/mem_sleep` shows the sleep mode in brackets, s2idle or deep. After a sleep, `journalctl -k -b | grep -E 'PM:|suspend'` shows which device refused, and the files under `/sys/power/suspend_stats/` count failures and name the last failing device. A restart in place of a wake leaves no line after 'suspend entry' at the end of `journalctl -k -b -1`. Try the other sleep mode to tell a firmware problem from a driver's. `hw-test sleep` measures a lid-close sleep with the owner. For a freeze on wake, check before the long press on power whether the Caps Lock light still toggles and whether the computer answers a ping from another machine, which tells a frozen desktop from a frozen kernel. Record `grep -H . /sys/bus/usb/devices/*/{product,speed}` and `cat /sys/class/drm/card*-*/status` with the same things plugged in. `journalctl --list-boots` lists the boots, and `hw-test note --log boot-N` attaches the kernel's log of the one that froze."

  - id: suspend-drain
    group: power
    title: Battery use while asleep
    works: A night asleep costs only a few percent of the battery.
    person: Note the charge before closing the lid for the night and after opening it.
    debug: "Compare `cat /sys/class/power_supply/*/energy_now` before and after an hour asleep. High drain in s2idle means the chip never reached its lowest state, and a device kept awake is the usual cause."

  - id: hibernate
    group: power
    title: Hibernation
    works: The laptop hibernates and resumes where it was.
    probe: Whether the kernel offers hibernation and has swap to hold it.
    person: Hibernate from the menu and start it again.
    debug: "`cat /sys/power/state` must list `disk`, and swap must be at least the size of memory. Where `disk` is missing the kernel offers no hibernation on this chip. That can't be fixed from the machine, so tell the owner and go on to the next part."

  - id: lid
    group: sensors
    title: Lid switch
    works: Closing and opening the lid is noticed, and nothing wakes it by itself.
    probe: Whether an input device reports the lid switch.
    debug: "The lid is a `gpio-keys` switch in the tree with `linux,code = <SW_LID>` on the hall sensor's GPIO, marked `wakeup-source`. `journalctl -b -u systemd-logind | grep Lid` shows its history. No switch at all means the node is missing. A switch that reads the wrong way round has the wrong GPIO polarity. `hw-test lid` watches it close and open."

  - id: usb
    group: ports
    title: USB ports
    works: Every USB-A and USB-C port takes devices at full speed, in both plug orientations.
    probe: Which USB controllers exist and the fastest speed each offers.
    person: Plug a USB stick into each port, both ways round on USB-C.
    debug: "Each USB-C port is a controller, a combo PHY and a connector under `pmic-glink` in the tree. USB-A ports hang off the multiport controller or a USB 2 controller, often behind a supply that has to be switched on. `grep -H . /sys/bus/usb/devices/*/speed` shows the speed of each port and device (`lsusb -t` does too, where usbutils is installed) and `journalctl -k -b | grep -iE 'dwc3|xhci|typec|ucsi'` the errors. Full speed in only one orientation of the plug means the port's orientation switch or retimer isn't described. `hw-test usb` reads the speed per port as things are plugged in."

  - id: external-display
    group: ports
    title: External screen
    works: A screen on USB-C (or HDMI, if it has one) shows a picture and can be plugged in and out.
    probe: The external display connectors and whether any is connected.
    person: Plug in a screen through USB-C, unplug it and plug it in again.
    desk:
      title: Screen
      works: A screen on HDMI, DisplayPort or USB-C shows a picture at its full resolution, and can be plugged in and out.
      person: Say which socket the screen is on, then unplug it and plug it in again.
    debug: "DisplayPort over USB-C needs the port's DP controller, the combo PHY, the orientation switch and on many machines a retimer (Parade PS883x) in the tree. `cat /sys/class/drm/card*-DP-*/status` and `journalctl -k -b | grep -iE 'typec|altmode|ps883|msm_dp'` show how far it gets. An HDMI port is a DisplayPort output behind a converter chip with a node and supplies of its own. `hw-test screen` reads the connection and mode when a screen is plugged in."

  - id: usb4
    group: ports
    title: USB4 and Thunderbolt
    works: USB4 docks and drives run at USB4 speed.
    probe: Whether the kernel created a USB4 domain.
    person: Plug in a USB4 or Thunderbolt dock or drive and say what speed it runs at.
    optional: true
    debug: "USB4 and Thunderbolt tunnelling don't work on these chips in Omarchy's kernel yet. Docks work as far as USB 3 and DisplayPort over USB-C carry them, and an empty `/sys/bus/thunderbolt/devices` is expected."

  - id: ethernet
    group: ports
    title: Ethernet
    works: A network cable gives a connection at the socket's full speed, also after sleep.
    probe: The wired network interface, its driver and the speed of the link. The network test reaches the router through it.
    person: Plug in a network cable and say whether the network comes up.
    optional: true
    debug: "The network chip is a card on PCIe (Realtek's `r8169` on most) or a USB one on an internal port (`r8152`). `ip -br link` lists the interfaces, and `journalctl -k -b | grep -iE 'r8169|r8152|atlantic|pci'` tells how far the driver gets. No PCI device means the tree's PCIe port, its PHY or the card's supply is missing or wrong, as for Wi-Fi. `cat /sys/class/net/*/speed` gives the speed a link settled on, and a link far below the socket's speed is more often the cable than the driver. `hw-test ethernet` reads the link and reaches the router through it."

  - id: camera
    group: media
    title: Webcam
    works: The webcam gives a picture in the browser and in video calls.
    probe: Whether a camera device from the camera subsystem or USB exists.
    person: Open a video call test page in Chromium and say whether the picture looks right.
    debug: "The webcam is a MIPI sensor, which the tree describes as a sensor node on a camera I2C bus with its clock, reset GPIO and supplies, linked to the camera subsystem in the tree. `cam -l` from libcamera names the sensor, and `journalctl -k -b | grep -iE 'camss|cci|ov0|imx|hi5'` shows one that didn't answer. `hw-test camera`, run by the owner, takes one frame, and the check works when they answer that the picture is real and its colours look right. A picture that is too dark, pale, green or noisy comes from libcamera's processing for that sensor (its tuning file), not from the driver. Omarchy has no place for a tuning fix yet, so don't open a pull request for one. Write a `workaround` note with what you changed, and open an issue on omacom/omarchy."

  - id: video-decode
    group: media
    title: Hardware video decoding
    works: Videos decode on the video engine or the GPU, not on the processor.
    probe: On a Snapdragon, whether the iris or venus video decoder exists. The video test decodes a two-second H.264 clip and counts the frames, on that decoder, or on an NVIDIA machine on its GPU through NVDEC or VA-API.
    person: Play a 1080p or 4K video in mpv or Chromium and say whether the processor stays mostly idle.
    debug: "The decoder is the `iris` driver (venus on older chips), with firmware from `qcom/vpu/` or the file the tree's `firmware-name` asks for. `journalctl -k -b | grep -iE 'iris|venus|vpu'` shows a missing file and `v4l2-ctl --list-devices` the decoder. `hw-test video` decodes a clip on it and counts the frames."

  - id: cdsp
    group: media
    title: Compute DSP (NPU)
    works: The compute DSP starts with its firmware.
    probe: The state of the cdsp remote processor and the firmware it loaded.
    debug: "As for the `adsp` check, `cat /sys/class/remoteproc/remoteproc*/{name,state,firmware}` shows its state and the maker-signed file it wants. Nothing else depends on it yet."

  - id: fans
    group: sensors
    title: Fans and temperatures
    works: The temperatures can be read and follow the load, and the fan speeds up when the computer gets hot.
    probe: Which temperature and fan sensors exist. The temperature test keeps every core and the GPU busy for up to two minutes and reads whether the sensors show the heat. It sees a fan start by its speed, or where no sensor gives that, by the temperature falling while the processor works on at the same rate.
    person: Press f during the temperature test the moment you hear the fan speed up, or say that the computer has none.
    debug: "Temperatures come from the chip's own sensors and need nothing per model. Fans are run by the embedded controller by itself, and their speed can be read only where the kernel has a driver for that model's controller (`ls /sys/class/hwmon/*/fan*_input`). A missing fan speed is a missing kernel driver, not a broken fan, and writing that driver is beyond a fix from the machine, so tell the owner. `hw-test temperatures` heats the computer and reports how the sensors follow. With the owner there, they press f when they hear the fan, which is what turns this check to works on a machine without a speed sensor."

  - id: fingerprint
    group: sensors
    title: Fingerprint reader
    works: The fingerprint reader enrolls a finger and unlocks with it.
    probe: Whether a known fingerprint reader is on USB.
    person: Enroll a finger with fprintd and try it.
    optional: true
    debug: "Readers are USB devices, supported or not by libfprint. `grep -H . /sys/bus/usb/devices/*/{idVendor,idProduct,product}` gives the ID to look up in libfprint's list of supported devices. A reader that isn't among them sits on an internal USB port whose supply or controller isn't enabled in the tree."

  - id: modem
    group: sensors
    title: Mobile broadband
    works: The 4G or 5G modem registers on a network.
    probe: Whether a modem processor or modem device exists.
    optional: true
    debug: "The modem is a PCIe or USB module (`lspci`, `grep -H . /sys/bus/usb/devices/*/product`, and `mmcli -L` where ModemManager is installed). It needs its port and power enabled in the tree, and ModemManager."
