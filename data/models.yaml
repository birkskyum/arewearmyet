# Every ARM PC model the board tracks. One entry per hardware model; variants
# that Linux describes with separate device trees are listed inside it.
#
#   generation     x1 (Snapdragon X), x2 (Snapdragon X2) or 8cx (8cx Gen 3)
#   chips          the processors it's sold with
#   variants       one per device tree: compatible is the tree's first
#                  compatible string, also for trees that are only posted or
#                  out of tree; ids are systemd hardware ID files to check even
#                  when they name a different compatible
#   firmware       linux-firmware folders with this model's files
#   acpi           aarch64-laptops/build misc/ folders with its ACPI dump
#   firmware_download  the vendor's driver page whose package has every firmware
#                  file its device tree loads
#   firmware_posted  the linux-firmware merge request adding its files, until it's merged
#   ids_collected  where its hardware IDs were sent, until they're in systemd
#   devicetree_posted  the posted device tree patch, until it's accepted
#   devicetree_out_of_tree  where a device tree for it lives outside Linux
#   devicetree_files  that tree's files, a URL each, a path under data/device-trees/<id>/ for a
#                  tree sent in to this repository, or a patch URL and #file to cut it out;
#                  scripts/trees.ts copies posted and out-of-tree trees to device-trees/
#   discussion     where owners work on it, when that's a separate thread
#   boot           android when it starts through Android's bootloader, like a Pixel,
#                  instead of UEFI; those models get their own section, with
#   bootloader     unlockable or locked, and
#   linux_image    boots or none: whether a Linux image starts on it yet
#   status         set when it was announced but isn't confirmed shipping
#   reports        what owners saw on the current Omarchy release: state works
#                  or problems, an optional variant, a short note and the month
#   sources        where the model's details come from

