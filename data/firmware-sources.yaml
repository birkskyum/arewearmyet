# Where each Snapdragon laptop's own firmware can be had from its maker, for the files
# linux-firmware doesn't ship yet. Nothing here is firmware: every entry is a download link and
# checksums, so a tool on any distro can fetch the maker's package (or take a copy the owner
# downloaded), check it and install the files where the device tree loads them. The same list is
# served as /firmware-sources.json.
#
# folders     one per firmware folder a device tree loads files from, under /usr/lib/firmware
#   models    the board's model ids whose device trees use it
#   files     name, size and SHA-256 of each file the device tree loads, and every package it
#             was found in, with its member path (archives inside the package joined with !/).
#             A file with no package has a note on where it comes from instead
#   links     names that are links to another file, as linux-firmware's WHENCE writes them
# packages    the maker downloads: title, url, the maker's page when the url changes per version,
#             size and SHA-256 as fetched, the date it was fetched, a note when fetching it
#             needs care, and manual: true when the url is a page the download has to be started
#             from by hand
#
# Packages unpack with 7-Zip, except Lenovo's (innoextract) and Microsoft's MSIs (msiextract).
# ASUS's are executables with a 7-Zip archive appended. A member ending in !xz@N is an XZ stream
# that starts N bytes into that file: the SoC control processor images sit like that inside the
# BIOS images in HP's and ASUS's packages. The files were matched byte for byte to the ones in
# the linux-firmware merge requests (!1331 to !1338 and !1341).

