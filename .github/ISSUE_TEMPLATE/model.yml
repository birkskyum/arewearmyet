name: Add your model
description: A model that's missing from the board, or what you know about one that's on it
labels: [model]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. Every model needs a device tree and its hardware IDs, which let a boot image pick that device tree by itself. Send what you have; one field is already useful.

        Don't paste serial numbers, and don't attach firmware files: they belong to the vendor, so a link to the vendor's download is what helps.

  - type: input
    id: model
    attributes:
      label: Laptop
      description: Brand and name, as the vendor sells it
      placeholder: ASUS Zenbook 14
    validations:
      required: true

  - type: input
    id: model-number
    attributes:
      label: Model number
      description: From the sticker underneath or the system information
      placeholder: UX3480QA
    validations:
      required: true

  - type: input
    id: chip
    attributes:
      label: Processor
      placeholder: Snapdragon X X1-26-100

  - type: textarea
    id: hwids
    attributes:
      label: Hardware IDs
      description: |
        Not needed with a hardware report. On Linux, the output of `sudo fwupdtool hwids`. On Windows, the output of this in PowerShell, which shows the strings the IDs are made from:
        `Get-CimInstance Win32_ComputerSystem | fl Manufacturer,Model,SystemFamily,SystemSKUNumber; Get-CimInstance Win32_BaseBoard | fl Manufacturer,Product; Get-CimInstance Win32_BIOS | fl Manufacturer,SMBIOSBIOSVersion,SystemBiosMajorVersion,SystemBiosMinorVersion; Get-CimInstance Win32_SystemEnclosure | fl ChassisTypes`
      render: text

  - type: input
    id: report
    attributes:
      label: Hardware report (Windows)
      description: The link to the report the [Omarchy Arm Installer](https://github.com/turbineBMW/omarchy-arm-installer/releases/latest) filed in omarchy-hardware-reports. It holds the ACPI tables, hardware IDs and firmware list.
      placeholder: https://github.com/turbineBMW/omarchy-hardware-reports/issues/1

  - type: textarea
    id: devicetree
    attributes:
      label: Device tree it boots with (Linux)
      description: |
        If Linux already runs on it, with another model's device tree or your own, drag in the file from `dtc -I fs -O dts /sys/firmware/devicetree/base > tree.dts`, and say which tree you started from and what you changed.

  - type: input
    id: distro
    attributes:
      label: Distro
      description: What you ran on it, if anything
      placeholder: Omarchy RC, Ubuntu 26.10, Fedora 44

  - type: dropdown
    id: boots
    attributes:
      label: Booting
      description: How far that distro got on it
      options:
        - Reached the desktop
        - Started, but didn't reach the desktop
        - Didn't start
        - Haven't tried

  - type: textarea
    id: acpi
    attributes:
      label: ACPI tables (optional)
      description: Only if you have a dump and no hardware report. Leave out the `MSDM` table, which holds the Windows product key.

  - type: input
    id: drivers
    attributes:
      label: Driver download
      description: The vendor's support page with the Windows driver package for this model, where the firmware files come from

  - type: checkboxes
    id: tester
    attributes:
      label: Testing
      options:
        - label: I own this laptop and can test boot images on it
