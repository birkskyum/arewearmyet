name: Refresh and deploy

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh

jobs:
  refresh:
    runs-on: ubuntu-26.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Collect the sources
        if: github.event_name != 'push'
        run: pnpm collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy the device trees not in Linux yet
        if: github.event_name != 'push'
        run: pnpm trees
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy the hardware IDs, reports and ACPI dumps
        if: github.event_name != 'push'
        run: pnpm archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The test results as they are now, also for a build after a push: who has run hw-test on
      # a model decides its "Who has one". A source being down mustn't stop the refresh, so this
      # one may fail, and the last copy is used then.
      - name: Copy the test results
        run: pnpm run owners || echo "::warning::the test results weren't copied"

      - run: pnpm status

      # Commit only when something besides the collection time changed
      - name: Commit changed data
        if: github.event_name != 'push'
        run: |
          git add data/sources.json data/owners.json src/data/status.json worker/models.json device-trees hwids reports acpi
          if git diff --cached -U0 | grep -E '^[+-] ' | grep -vqE '"collected"'; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh the data'
            git push
          fi

      # A change that breaks the reports API or the probe doesn't get deployed
      - run: pnpm typecheck
      - run: pnpm test
      - name: Test the app
        working-directory: app
        run: go vet ./... && go test ./...
      - run: shellcheck -S warning public/probe.sh scripts/probe-fixture.sh test/probe/bin/*

      - run: pnpm build

      # Skipped until the repository has a Cloudflare token
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm wrangler deploy

      # One issue, labelled digest, that says where owners' reports add to or disagree with the findings
      - name: Compare owners' reports with the findings
        if: github.event_name != 'push' && env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm digest --issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
