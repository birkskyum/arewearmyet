name: Refresh and deploy

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      # Asked for by the reports API (worker/rebuild.ts) when owners' results change. Builds as after
      # a push, without collecting the sources or committing
      results:
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  issues: write

# One run at a time, and the newest of the waiting ones. A results build that arrives while a scheduled
# run waits takes its place, and that day's collection is skipped
concurrency:
  group: refresh

jobs:
  refresh:
    runs-on: ubuntu-26.04
    env:
      # Collect the sources and commit what changed: the daily run and a dispatch by hand
      FULL: ${{ github.event_name != 'push' && !inputs.results }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Collect the sources
        if: env.FULL == 'true'
        run: pnpm collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy the device trees not in Linux yet
        if: env.FULL == 'true'
        run: pnpm trees
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy the hardware IDs, reports and ACPI dumps
        if: env.FULL == 'true'
        run: pnpm archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The test results as they are now, also for a build after a push, since who has run hw-test on
      # a model decides its "Who has one". A source being down mustn't stop the refresh, so this
      # one may fail, and the last copy is used then.
      - name: Copy the test results
        run: pnpm run owners || echo "::warning::the test results weren't copied"

      - run: pnpm status

      # Commit only when something besides the collection time changed
      - name: Commit changed data
        if: env.FULL == 'true'
        run: |
          collected='data/sources.json data/owners.json device-trees hwids reports acpi'
          commit() {
            git add $collected src/data/status.json worker/models.json
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh the data'
          }
          git add $collected src/data/status.json worker/models.json
          if git diff --cached -U0 | grep -E '^[+-] ' | grep -vqE '"collected"'; then
            commit
            pushed=
            for attempt in 1 2 3; do
              if git push; then pushed=yes; break; fi
              # Someone pushed while this ran. Take their work, keep what was collected here
              # and work the rest out again from the two together
              ours=$(git rev-parse HEAD)
              git fetch origin main
              git reset --hard origin/main
              git checkout "$ours" -- $collected
              pnpm status
              commit || { pushed=yes; break; }
            done
            [ -n "$pushed" ]
          fi

      # A change that breaks the reports API or hw-test doesn't get deployed
      - run: pnpm typecheck
      - run: pnpm test
      - name: Test the app
        working-directory: app
        run: go vet ./... && go test ./...
      - run: shellcheck -S warning public/probe.sh scripts/probe-fixture.sh

      - run: pnpm build

      # Skipped until the repository has a Cloudflare token
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm wrangler deploy

      # Results that came in after this build copied them asked for no build of their own, since the
      # API asks once a minute at most. Build again for them
      - name: Build again for results that came in meanwhile
        if: inputs.results && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          cp data/owners.json "$RUNNER_TEMP/built.json"
          pnpm run owners || exit 0
          if ! cmp -s data/owners.json "$RUNNER_TEMP/built.json"; then gh workflow run refresh.yml --ref main -f results=true; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # One issue, labelled digest, that says where owners' reports add to or disagree with the findings
      - name: Compare owners' reports with the findings
        if: env.FULL == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm digest --issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
